<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="戦術ボードの状況を読んで次のプレーを選び、選手の動きと解説で理由を学ぶサッカー戦術クイズ。初級・中級・上級（指導者向け）の3段階。">
<meta name="theme-color" content="#0E1310">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="戦術ドリル">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{background:#0E1310;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>サッカー戦術ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 1画面完結。戦術ボード（枠付きピッチ＋マグネット）が残りの高さを埋め、問題とフィードバックは下（横長なら右）のパネルにタブで収める */
/* 配色: 黒ベースの1テーマ（ユーザーの指定）。端末のライト/ダーク設定にかかわらず同じ見た目 */
:root {
  --bg: #0E1310; --surface: #161D18; --ink: #E6ECE4; --muted: #96A399; --line: #2A352D;
  --frame: #212A23; --frame-hi: #2C362E;
  --accent: #7D9CFF; --accent-ink: #0E1310;
  --good: #43C881; --ok: #E5B23A; --bad: #FF6D5E; --on-sem: #0E1310;
  --grass: #1E5634; --grass-2: #1A4D2E; --chalk: rgba(228, 239, 230, .78);
  --home: #3F6DF5; --away: #EE4A3B; --pen: #FFD43B; --pen-ink: #1B1A10;
  --p-good: #8DF7B8; --p-bad: #FF8B7B; --pen-mark: #FFD43B; --hl: rgba(255, 212, 59, .3);
  --f-disp: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}

/* 1画面に収める: html/body/#app を画面の高さに固定し、各画面の中だけで配分する */
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
/* 改行: 日本語は文節の境目（app.js の phrase() が <wbr> を入れる）だけで折り返す。収まらない長い語だけ途中で折る */
body { word-break: keep-all; overflow-wrap: anywhere; line-break: strict; }
p, .opt .l, .lv-who { text-wrap: pretty; }
h1, h2, .lead, .msg { text-wrap: balance; }
#app {
  height: 100%; max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.screen { height: 100%; min-height: 0; display: flex; flex-direction: column; }

.btn { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 10px 16px; border-radius: 10px; cursor: pointer; line-height: 1.4; transition: transform .12s, filter .12s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--accent); }
.link { appearance: none; background: none; border: 0; color: var(--accent); cursor: pointer; font-weight: 700; }
.eyebrow { font: 600 11px/1.4 var(--f-mono); letter-spacing: .14em; color: var(--muted); }

/* ホーム */
.home { gap: clamp(12px, 2.4vh, 22px); justify-content: center; overflow-y: auto; }
.h-side { display: flex; flex-direction: column; gap: clamp(10px, 2vh, 16px); }
.h-top h1 { font: 400 clamp(30px, 7.6vw, 60px)/1.12 var(--f-disp); margin-block: 6px 8px; text-wrap: balance; }
.lead { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 30em; }
.key { list-style: none; margin: 0; padding: 10px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 10px; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.key li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.key svg { width: 16px; height: 16px; flex: none; }
.key svg.wide { width: 26px; height: 9px; }
.k-home { fill: var(--home); } .k-away { fill: var(--away); }
.k-me { fill: none; stroke: var(--pen-mark); stroke-width: .5; stroke-dasharray: 1 .6; }
.k-ln { fill: none; stroke: var(--ink); stroke-width: .9; stroke-linecap: round; }
.k-dash { stroke-dasharray: 1.6 1.2; }
.k-hd { fill: var(--ink); }
.foot { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); line-height: 1.6; }
.levels { display: flex; flex-direction: column; gap: 10px; }
.lv { appearance: none; display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px 11px; cursor: pointer; line-height: 1.5; transition: border-color .15s, transform .12s; }
.lv:hover { border-color: var(--accent); }
.lv:active { transform: translateY(1px); }
.lv > span { display: block; min-width: 0; }
.lv .lv-head { display: flex; align-items: center; gap: 9px; }
.pips { display: flex; gap: 3px; flex: none; }
.pips i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--home); }
.pips i.on { background: var(--home); }
.lv-name { flex: none; font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.lv-title { min-width: 0; font: 400 19px/1.35 var(--f-disp); }
.lv-best { margin-left: auto; flex: none; font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lv-best b { font: 600 16px var(--f-mono); color: var(--ink); margin-left: 4px; }
.lv .lv-who { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 12.5px; color: var(--muted); }
.lv-tag { white-space: nowrap; font-size: 11px; font-weight: 700; color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; line-height: 1.6; }
.lv-topics { font-size: 12px; color: var(--ink); opacity: .8; text-wrap: balance; }
.lv-topics span { white-space: nowrap; margin-right: 6px; }
.lv-topics span::before { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: 3px; }

/* 問題画面 */
.play { gap: 8px; }
.bar { display: flex; align-items: center; gap: 10px; min-height: 30px; flex: none; }
.back { font-size: 19px; padding: 0 4px 0 0; line-height: 1; }
.bar-lv { font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.dots { flex: 1; list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; min-width: 40px; }
.dots li { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.dots li.now { background: var(--accent); }
.dots li.r2 { background: var(--good); } .dots li.r1 { background: var(--ok); } .dots li.r0 { background: var(--bad); }
.bar-q, .bar-pt { font: 600 13px var(--f-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar-q small, .bar-pt { color: var(--muted); }
.bar-pt b { color: var(--ink); font-size: 15px; }

.stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.board-area { flex: 1 1 auto; min-height: 140px; container-type: size; display: grid; place-items: center; }
.board { --fp: 6px; position: relative; padding: var(--fp); border-radius: 12px; background: linear-gradient(160deg, var(--frame-hi), var(--frame)); box-shadow: 0 1px 0 var(--line), 0 12px 24px -16px rgba(0, 0, 0, .45); width: min(100cqw, calc((100cqh - 2 * var(--fp)) * var(--ar) + 2 * var(--fp))); }
#pitch { display: block; width: 100%; height: auto; border-radius: 7px; background: var(--grass); }
.dir { position: absolute; right: 12px; top: 11px; font: 600 10.5px var(--f-mono); color: var(--pen); background: rgba(0, 0, 0, .38); padding: 1px 8px; border-radius: 99px; pointer-events: none; }
.stamp { position: absolute; left: 12px; top: 10px; white-space: nowrap; font-weight: 700; font-size: 13px; padding: 3px 12px; box-shadow: 0 4px 12px -6px rgba(0, 0, 0, .6); border-radius: 99px; color: var(--on-sem); pointer-events: none; }
.stamp.v2 { background: var(--good); } .stamp.v1 { background: var(--ok); } .stamp.v0 { background: var(--bad); }
.hint-cap { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.5; box-shadow: 0 6px 16px -8px rgba(0, 0, 0, .5); }

.panel { flex: 0 0 auto; max-height: 66%; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.panel.is-fb { overflow: hidden; }
.qhead { display: flex; align-items: center; gap: 8px; }
.phase { flex: none; font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 99px; color: var(--on-sem); line-height: 1.6; }
.ph-atk { background: var(--home); color: #FFFFFF; } .ph-def { background: var(--away); color: #FFFFFF; }
.ph-tr { background: var(--ok); } .ph-coach { background: var(--ink); color: var(--bg); }
.qt { flex: 1; min-width: 0; font: 400 18px/1.3 var(--f-disp); text-wrap: balance; }
.hint-btn { flex: none; appearance: none; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); border-radius: 99px; padding: 1px 11px; font-size: 12px; font-weight: 700; cursor: pointer; }
.hint-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sit { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
.qq { font-weight: 700; font-size: 15px; line-height: 1.5; }
.opts { display: grid; gap: 6px; margin-top: auto; }
.opt { appearance: none; display: flex; align-items: center; gap: 10px; min-height: 44px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 11px; padding: 7px 12px; cursor: pointer; font-size: 14px; line-height: 1.45; transition: border-color .15s; }
.opt:hover { border-color: var(--accent); }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--pen); color: var(--pen-ink); font: 600 13px var(--f-mono); }

.tabs { flex: none; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 2.5px solid transparent; margin-bottom: -1px; padding: 4px 10px 6px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 14px; line-height: 1.65; padding-top: 2px; }
.oline { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; line-height: 1.45; }
.oline .k { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--f-mono); color: var(--on-sem); }
.k2 { background: var(--good); } .k1 { background: var(--ok); } .k0 { background: var(--bad); }
.oline + p + .oline { margin-top: 6px; }
.term .hl { font-size: 19px; background: linear-gradient(transparent 58%, var(--hl) 58%); padding-inline: 2px; }
.acts { flex: none; display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { padding: 9px 14px; }
.play .acts .btn:last-child { flex: 1 1 auto; }

/* 結果 */
.result { gap: clamp(10px, 2vh, 18px); justify-content: center; overflow-y: auto; max-width: 620px; width: 100%; margin-inline: auto; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.score b { font: 400 clamp(52px, 11vh, 88px)/1 var(--f-disp); font-variant-numeric: tabular-nums; }
.score span { font: 600 20px var(--f-mono); color: var(--muted); }
.score em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--pen-ink); background: var(--pen); padding: 2px 10px; border-radius: 99px; }
.msg { font-size: 15px; font-weight: 500; line-height: 1.6; margin-top: 6px; }
.rlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rlist li { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.chip { font-size: 11.5px; font-weight: 700; text-align: center; padding: 1px 0; border-radius: 99px; color: var(--on-sem); white-space: nowrap; }
.chip.c2 { background: var(--good); } .chip.c1 { background: var(--ok); } .chip.c0 { background: var(--bad); }
.rt { display: flex; flex-direction: column; min-width: 0; line-height: 1.4; }
.rt b { font-size: 14px; }
.rt small { font-size: 12px; color: var(--muted); }

/* 背の低い画面: ホームとフィードバックの文字・余白を少し詰める */
@media (max-height: 660px) {
  .home { gap: 10px; }
  .h-side { gap: 8px; }
  .h-top h1 { font-size: 27px; margin-block: 0 4px; }
  .lead { font-size: 13px; line-height: 1.5; }
  .key { padding: 7px 10px; gap: 2px 10px; }
  .foot { font-size: 11.5px; line-height: 1.5; }
  .levels { gap: 8px; }
  .lv { padding: 8px 12px 9px; gap: 1px; }
  .lv-title { font-size: 17px; }
}
@media (max-height: 700px) {
  .tabbody { font-size: 13.5px; line-height: 1.52; gap: 4px; }
  .oline { font-size: 12.5px; }
  .sit { font-size: 13px; line-height: 1.55; }
}

/* 横長の画面: ボードを左、問題を右に並べる */
@media (min-width: 720px) and (min-aspect-ratio: 5/4) {
  .stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, 1fr); grid-template-rows: minmax(0, 1fr); gap: 24px; }
  .board-area { min-height: 0; height: 100%; }
  .panel { max-height: none; height: 100%; justify-content: center; gap: 10px; }
  .panel.is-fb { justify-content: flex-start; padding-top: 8px; }
  .opts { margin-top: 0; }
  .qt { font-size: 24px; } .sit { font-size: 14.5px; } .qq { font-size: 16.5px; }
  .opt { font-size: 15px; padding: 10px 14px; }
  .tabbody { font-size: 15px; }
  .home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-content: center; align-items: center; column-gap: 48px; }
}

/* ピッチ内 SVG */
.grass { fill: var(--grass); } .mow { fill: var(--grass-2); }
.chalk * { fill: none; stroke: var(--chalk); stroke-width: .22; }
.spots { fill: var(--chalk); }
.goal rect { fill: var(--chalk); fill-opacity: .14; stroke: var(--chalk); stroke-width: .22; }
.lanes line { stroke: var(--chalk); stroke-width: .18; stroke-dasharray: .8 .8; opacity: .7; }
.lanes text { fill: var(--chalk); font: 500 1.5px var(--f-body); text-anchor: middle; opacity: .85; }
.offside line { stroke: var(--p-bad); stroke-width: .25; stroke-dasharray: 1 .7; }
.offside text { fill: var(--p-bad); font: 700 1.5px var(--f-body); }

.og { color: var(--pen); cursor: pointer; transition: opacity .3s; }
.answered .og { cursor: default; }
.og .ln { fill: none; stroke: currentColor; stroke-width: .42; stroke-linecap: round; stroke-linejoin: round; }
.og .k-run { stroke-dasharray: 1.2 .9; }
.og .k-look { stroke-dasharray: .05 .85; stroke-width: .55; }
.og .hd { fill: currentColor; }
.og .ring { fill: currentColor; fill-opacity: .12; stroke: currentColor; stroke-width: .32; stroke-dasharray: .9 .6; }
.bdg circle { fill: currentColor; stroke: rgba(0, 0, 0, .35); stroke-width: .25; }
.bdg .hit { fill: transparent; stroke: none; pointer-events: all; }
.answered .bdg .hit { pointer-events: none; }
.bdg text { pointer-events: none;  fill: var(--pen-ink); font: 600 2.1px var(--f-mono); text-anchor: middle; }
.og:hover .bdg circle:not(.hit) { stroke: var(--pen-ink); stroke-width: .4; }
.og.r2 { color: var(--p-good); } .og.r2 .ln { stroke-width: .6; }
.og.r1 { color: var(--pen); } .og.r0 { color: var(--p-bad); }
.og.dim { opacity: .18; }

.pl, .ball { transition: transform .85s cubic-bezier(.45, .05, .25, 1); }
.ball { transition-duration: .7s; }
.snap .pl, .snap .ball { transition: none; }
.mag { stroke: rgba(0, 0, 0, .4); stroke-width: .25; }
.t-h .mag { fill: var(--home); } .t-a .mag { fill: var(--away); }
.gk .mag { stroke: var(--chalk); stroke-width: .45; }
.shine { fill: #FFFFFF; opacity: .26; }
.num { fill: #FFFFFF; font: 600 2.05px var(--f-mono); text-anchor: middle; }
.me-ring { fill: none; stroke: var(--pen); stroke-width: .42; stroke-dasharray: 1 .65; transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
.me-lb { fill: var(--pen); font: 700 1.7px var(--f-body); text-anchor: middle; paint-order: stroke; stroke: rgba(0, 0, 0, .55); stroke-width: .45; }
.ball circle { fill: #FFFFFF; stroke: #141414; stroke-width: .2; }
.ball .bp { fill: #141414; stroke: none; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .pl, .ball, .og, .btn, .lv { transition: none; }
  .me-ring { animation: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Lv.1 初級 — 座標はメートル（ピッチ 68×105）。y=0 が相手ゴール、味方は常に上へ攻める。
window.LEVELS = window.LEVELS || [];
window.LEVELS[0] = {
  id: 'basic', no: 1, name: '初級', title: '基本の原則',
  who: 'はじめての選手・保護者', feat: 'ヒントつき',
  q: [
    {
      t: 'パスを出したあと', ph: 'atk', me: 'h6', view: [-2, 22, 72, 50],
      h: [[6, 32, 62], [8, 48, 52], [10, 22, 42], [9, 36, 28], [2, 60, 64], [4, 26, 70]],
      a: [[8, 48, 46], [10, 40, 57], [6, 24, 37], [4, 33, 24]],
      ball: [48, 52],
      s: '6番（あなた）が右の8番へパスを出した。8番の前には相手8番がいて、前を向けない。',
      q: 'パスを出した6番は、このあとどう動く？',
      hint: '8番から6番への「戻しのパス」の線上に、誰かいないかな？',
      opts: [
        { k: 'A', l: 'その場に止まって、戻しのパスを待つ', sc: 0, mk: [32, 62],
          why: '相手10番が、ちょうど8番と6番を結ぶ線の上にいます。止まっていると戻しのパスが通りません。' },
        { k: 'B', l: '8番のすぐ近くまで寄っていく', sc: 1, mk: [44, 58],
          why: '受けることはできますが、相手1人で2人をまとめて見られる距離です。周りのスペースもなくなります。' },
        { k: 'C', l: '斜め前に動いて、相手の間で受けられる位置をとる', sc: 2, mk: [36, 47],
          why: '相手10番の陰から出て、8番から見えるパスコースができました。8番・6番・10番で三角形ができ、次のパスの選択肢も増えます。' }
      ],
      play: [{ m: { h6: [36, 47] } }, { b: [36, 47] }, { b: [36, 29] }],
      ex: 'パスは出したら終わりではありません。出した瞬間に「次にどこでもらえるか」を考えて動くのがパス&ムーブです。相手の体でパスコースが消えていないかを確かめ、斜めの位置をとると三角形ができます。',
      key: ['パス&ムーブ', 'パスを出した直後に動き、次のパスを受けられる位置をとること。三角形をつくると選択肢が増える。']
    },
    {
      t: '2対1のチャンス', ph: 'atk', me: 'h10', view: [-2, -3, 72, 52],
      h: [[10, 30, 40], [11, 12, 38], [9, 46, 18]],

    let g = '<rect class="grass" x="-8" y="-8" width="84" height="121"/>';
    for (let i = 0; i < 14; i++) if (i % 2) g += `<rect class="mow" x="-8" y="${i * 7.5}" width="84" height="7.5"/>`;
    g += `<g class="goal"><rect x="30.34" y="-2.2" width="7.32" height="2.2"/><rect x="30.34" y="105" width="7.32" height="2.2"/></g>
    <g class="chalk">
      <rect x="0" y="0" width="68" height="105"/>
      <line x1="0" y1="52.5" x2="68" y2="52.5"/>
      <circle cx="34" cy="52.5" r="9.15"/>
      <rect x="13.84" y="0" width="40.32" height="16.5"/>
      <rect x="24.84" y="0" width="18.32" height="5.5"/>
      <path d="M26.69 16.5A9.15 9.15 0 0 0 41.31 16.5"/>
      <rect x="13.84" y="88.5" width="40.32" height="16.5"/>
      <rect x="24.84" y="99.5" width="18.32" height="5.5"/>
      <path d="M26.69 88.5A9.15 9.15 0 0 1 41.31 88.5"/>
      <path d="M0 1A1 1 0 0 0 1 0M67 0A1 1 0 0 0 68 1M68 104A1 1 0 0 0 67 105M1 105A1 1 0 0 0 0 104"/>
    </g>
    <g class="spots"><circle cx="34" cy="52.5" r=".4"/><circle cx="34" cy="11" r=".4"/><circle cx="34" cy="94" r=".4"/></g>`;
    return g;
  }

  function lanes(v) {
    const xs = [13.84, 24.84, 43.16, 54.16];
    const names = [[6.92, 'サイド'], [19.34, 'ハーフ'], [34, '中央'], [48.66, 'ハーフ'], [61.08, 'サイド']];
    const y2 = v[1] + v[3];
    let g = '<g class="lanes">';
    xs.forEach(x => { g += `<line x1="${x}" y1="${v[1]}" x2="${x}" y2="${y2}"/>`; });
    names.forEach(([x, n]) => { g += `<text x="${x}" y="${f(y2 - 1.4)}">${n}</text>`; });
    return g + '</g>';
  }

  function offside(y) {
    return `<g class="offside"><line x1="-1" y1="${y}" x2="69" y2="${y}"/><text x="1" y="${y - 0.9}">オフサイドライン</text></g>`;
  }

  // 矢印: [始点, 終点, 種類, 制御点?]  種類 pass=実線 / run=破線 / drib=波線 / look=点線
  function arrow(a) {
    const [p, q, kind, c] = a;
    const from = c || p;
    let ux = q[0] - from[0], uy = q[1] - from[1];
    const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
    const e = [q[0] - ux * 1.1, q[1] - uy * 1.1];
    let d;
    if (kind === 'drib') {
      const dx = e[0] - p[0], dy = e[1] - p[1], len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len, N = Math.max(10, Math.ceil(len * 5)), pts = [];
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const amp = 0.6 * Math.min(1, (len * (1 - t)) / 1.6, (len * t) / 1.2);
        const w = Math.sin((t * len / 1.8) * Math.PI * 2) * amp;
        pts.push(f(p[0] + dx * t + nx * w) + ' ' + f(p[1] + dy * t + ny * w));
      }
      d = 'M' + pts.join('L');
    } else if (c) {
      d = `M${p[0]} ${p[1]}Q${c[0]} ${c[1]} ${f(e[0])} ${f(e[1])}`;
    } else {
      d = `M${p[0]} ${p[1]}L${f(e[0])} ${f(e[1])}`;
    }
    const bx = q[0] - ux * 1.8, by = q[1] - uy * 1.8, nx = -uy * 0.85, ny = ux * 0.85;
    const head = `${f(q[0])},${f(q[1])} ${f(bx + nx)},${f(by + ny)} ${f(bx - nx)},${f(by - ny)}`;
    return { svg: `<path class="ln k-${kind}" d="${d}"/><polygon class="hd" points="${head}"/>`, tip: [q[0] + ux * 2.6, q[1] + uy * 2.6] };
  }

  function optG(o) {
    let g = '', at = o.at;
    (o.ar || []).forEach((a, i) => { const r = arrow(a); g += r.svg; if (!at && i === 0) at = r.tip; });
    if (o.mk) { g += `<circle class="ring" cx="${o.mk[0]}" cy="${o.mk[1]}" r="2.5"/>`; if (!at) at = o.mk; }
    if (!at) return '';
    g += `<g class="bdg" transform="translate(${f(at[0])} ${f(at[1])})"><circle class="hit" r="3.4"/><circle r="1.75"/><text y=".7">${o.k}</text></g>`;
    return `<g class="og" data-k="${o.k}">${g}</g>`;
  }

  function players(s) {
    let g = '';
    const add = (t, [n, x, y]) => {
      const id = t + n, me = s.me === id;
      g += `<g class="pl t-${t}${n === 1 ? ' gk' : ''}${me ? ' me' : ''}" data-id="${id}" style="transform:translate(${x}px,${y}px)">` +
        (me ? '<circle class="me-ring" r="3.2"/>' : '') +
        `<circle class="mag" r="2"/><circle class="shine" cx="-.55" cy="-.7" r=".75"/><text class="num" y=".74">${n}</text>` +
        (me ? '<text class="me-lb" y="-3.9">あなた</text>' : '') + '</g>';
    };
    s.a.forEach(p => add('a', p));
    s.h.forEach(p => add('h', p));
    return g;
  }

  const ballXY = p => `translate(${f(p[0] + BO[0])}px,${f(p[1] + BO[1])}px)`;

  function pitchSVG(s) {
    const v = s.view;
    const label = `${PH[s.ph]}の場面。青が味方、赤が相手。味方は上に向かって攻めている。`;
    return `<svg id="pitch" viewBox="${v.join(' ')}" role="img" aria-label="${label}">
      ${field()}${s.lanes ? lanes(v) : ''}${s.line ? offside(s.line) : ''}
      <g class="opts-g">${s.opts.map(optG).join('')}</g>
      <g class="pls">${players(s)}</g>
      <g class="ball" style="transform:${ballXY(s.ball)}"><circle r=".95"/><circle class="bp" r=".38"/></g>
    </svg>`;
  }

  /* ---------- アニメーション ---------- */
  function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; }
  function placeAll(s) {
    const svg = document.getElementById('pitch'); if (!svg) return;
    svg.classList.add('snap');
    [['a', s.a], ['h', s.h]].forEach(([t, arr]) => arr.forEach(([n, x, y]) => {
      const el = svg.querySelector(`[data-id="${t}${n}"]`); if (el) el.style.transform = `translate(${x}px,${y}px)`;
    }));
    svg.querySelector('.ball').style.transform = ballXY(s.ball);
    void svg.getBoundingClientRect();
    svg.classList.remove('snap');
  }
  function play(s) {
    clearTimers(); placeAll(s);
    const svg = document.getElementById('pitch');
    const gap = reduce ? 700 : 1050;
    s.play.forEach((st, i) => {
      S.timers.push(setTimeout(() => {
        if (!svg.isConnected) return;
        Object.entries(st.m || {}).forEach(([id, [x, y]]) => {
          const el = svg.querySelector(`[data-id="${id}"]`); if (el) el.style.transform = `translate(${x}px,${y}px)`;
        });
        if (st.b) svg.querySelector('.ball').style.transform = ballXY(st.b);
      }, 350 + i * gap));
    });
  }

  /* ---------- 改行位置: 日本語の文を文節の境目でだけ折り返す ----------
     body の word-break: keep-all と組み合わせ、文節の間に <wbr> を入れる（BudouX）。
     innerHTML で文を差し込んだら、その要素に phrase() をかける。SVG の中は対象外。 */
  const JA = /[　-ヿ㐀-鿿＀-￯]/;
  // 行頭に来てはいけない文字（助詞・小さいかな・閉じ括弧・句読点）で始まる文節は前の文節につなげる。
  // BudouX は「（あなた）|は」「」|の」のように括弧の後で切ることがあるため。
  const NO_START = /^[をにがはのへてゃゅょぁぃぅぇぉっァィゥェォッャュョー、。・）」』，．：！？]/;
  // 閉じ括弧の直後はブラウザが keep-all でも折るので、文節の中では WORD JOINER（U+2060）でつなぐ。
  const phrases = text => window.BudouX.parse(text).reduce((a, p) => {
    if (a.length && NO_START.test(p)) a[a.length - 1] += p; else a.push(p);
    return a;
  }, []).map(p => p.replace(/([）」』)])(?=.)/g, '$1⁠'));
  function phrase(root) {
    if (!root || !window.BudouX) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (JA.test(n.nodeValue) && !n.parentElement.closest('svg, script, style')
        && !/^(nowrap|pre)/.test(getComputedStyle(n.parentElement).whiteSpace)) // 1行のラベルには入れない（Chrome は nowrap でも <wbr> で折る）
        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
    });
    const list = [];
    while (w.nextNode()) list.push(w.currentNode);
    list.forEach(n => {
      const parts = phrases(n.nodeValue);
      if (parts.length < 2) return;
      const frag = document.createDocumentFragment();
      parts.forEach((p, i) => {
        if (i) frag.appendChild(document.createElement('wbr'));
        frag.appendChild(document.createTextNode(p));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

  /* ---------- 画面: ホーム ---------- */
  const TWO_COL = '(min-width: 720px) and (min-aspect-ratio: 5/4)';
  function pips(n) { return [0, 1, 2].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join(''); }

  function home() {
    S.screen = 'home'; clearTimers();
    const best = loadBest();
    app.innerHTML = `
    <div class="screen home">
      <div class="h-side">
        <header class="h-top">
          <h1>サッカー戦術ドリル</h1>
          <p class="lead">ボードの状況を読んで次のプレーを選ぶ。選手が動いて、その理由を見せてくれます。</p>
        </header>
        <ul class="key" aria-label="ボードの見方">
          <li><svg viewBox="-3 -3 6 6" aria-hidden="true"><circle r="2.4" class="k-home"/></svg>味方</li>
          <li><svg viewBox="-3 -3 6 6" aria-hidden="true"><circle r="2.4" class="k-away"/></svg>相手</li>
          <li><svg viewBox="-3 -3 6 6" aria-hidden="true"><circle r="2.5" class="k-me"/><circle r="1.6" class="k-home"/></svg>あなた</li>
          <li><svg class="wide" viewBox="0 -2 16 4" aria-hidden="true"><path class="k-ln" d="M1 0H13"/><path class="k-hd" d="M15 0L12.6-1.3V1.3Z"/></svg>パス</li>
          <li><svg class="wide" viewBox="0 -2 16 4" aria-hidden="true"><path class="k-ln k-dash" d="M1 0H13"/><path class="k-hd" d="M15 0L12.6-1.3V1.3Z"/></svg>走る</li>
          <li><svg class="wide" viewBox="0 -2 16 4" aria-hidden="true"><path class="k-ln" d="M1 0Q2 -1.2 3 0T5 0T7 0T9 0T11 0T13 0"/><path class="k-hd" d="M15 0L12.6-1.3V1.3Z"/></svg>ドリブル</li>
        </ul>
        <p class="foot"><span>味方はいつも上（↑）へ攻めます。</span><span>採点：ベスト2点・悪くない1点・要注意0点</span></p>
      </div>
      <nav class="levels" aria-label="レベルを選ぶ">
        ${LV.map((L, i) => {
          const b = best[L.id];
          return `<button class="lv" data-start="${i}" aria-label="Lv.${L.no} ${L.name} ${L.title}">
            <span class="lv-head"><span class="pips" aria-hidden="true">${pips(L.no)}</span><span class="lv-name">${L.name}</span><span class="lv-title">${L.title}</span><span class="lv-best">最高<b>${b == null ? '—' : b}</b>/${maxOf(L)}</span></span>
            <span class="lv-who">${L.who}向け${L.feat ? `<span class="lv-tag">${L.feat}</span>` : ''}</span>
            <span class="lv-topics">${L.q.map(q => `<span>${q.key[0].replace(/（.*?）/, '')}</span>`).join(' ')}</span>
          </button>`;
        }).join('')}
      </nav>
    </div>`;
    phrase(app);
  }

  /* ---------- 画面: 問題 ---------- */
  function dots() {
    return LV[S.lv].q.map((_, i) => {
      const a = S.ans[i];
      return `<li class="${a ? 'r' + a.sc : (i === S.qi ? 'now' : '')}"></li>`;
    }).join('');
  }

  function question() {
    S.screen = 'play'; S.done = false; S.tab = 'why'; clearTimers();
    const L = LV[S.lv], s = cur(), v = s.view;
    app.innerHTML = `
    <div class="screen play">
      <nav class="bar">
        <button class="link back" id="back" aria-label="レベル選択へ戻る">←</button>
        <span class="bar-lv">Lv.${L.no} ${L.name}</span>
        <ol class="dots" aria-hidden="true">${dots()}</ol>
        <span class="bar-q">${S.qi + 1}<small>/${L.q.length}</small></span>
        <span class="bar-pt"><b id="pt">${total()}</b>点</span>
      </nav>
      <div class="stage">
        <div class="board-area">
          <div class="board" id="board" style="--ar:${f(v[2] / v[3])}">${pitchSVG(s)}
            <span class="dir">攻撃 ↑</span>
            <span class="stamp" id="stamp" hidden></span>
            ${s.hint ? `<p class="hint-cap" id="hint" hidden>ヒント：${s.hint}</p>` : ''}
          </div>
        </div>
        <section class="panel" id="panel">
          <div class="qhead">
            <span class="phase ph-${s.ph}">${PH[s.ph]}</span>
            <h2 class="qt">${s.t}</h2>
            ${s.hint ? '<button class="hint-btn" id="hintBtn" aria-pressed="false">ヒント</button>' : ''}
          </div>
          <p class="sit">${s.s}</p>
          <p class="qq">${s.q}</p>
          <div class="opts" role="group" aria-label="選択肢">
            ${s.opts.map(o => `<button class="opt" data-k="${o.k}"><span class="k">${o.k}</span><span class="l">${o.l}</span></button>`).join('')}
          </div>
        </section>
      </div>
    </div>`;
    phrase(app);
    lockPanel();
  }

  // 縦並びのとき、回答後に出る解説（どの選択肢・どのタブでも）が収まる高さを先に測ってパネルを固定する。
  // 問題と解説でパネルの高さが同じなので、ボードの大きさは変わらない。ボードには最低でも残り高さの 38% を残す。
  function lockPanel() {
    const panel = document.getElementById('panel');
    if (!panel || matchMedia(TWO_COL).matches) return;
    const s = cur(), room = document.querySelector('.stage').clientHeight;
    const probe = document.createElement('section');
    probe.className = 'panel is-fb';
    probe.setAttribute('aria-hidden', 'true');
    probe.style.cssText = `position:absolute;left:-9999px;top:0;visibility:hidden;max-height:none;height:auto;width:${panel.clientWidth}px`;
    panel.parentNode.appendChild(probe);
    let need = 0;
    s.opts.forEach(o => {
      tabList(s, o, bestOf(s)).forEach(([id]) => {
        probe.innerHTML = fbHTML(s, o, id, false);
        phrase(probe);
        need = Math.max(need, probe.scrollHeight);
      });
    });
    probe.remove();
    panel.style.height = Math.round(Math.min(Math.max(panel.offsetHeight, need), room * 0.62)) + 'px';
  }

  const bestOf = s => s.opts.reduce((p, q) => (q.sc > p.sc ? q : p));

  function fbHTML(s, o, tab, last) {
    return `
      <div class="tabs" role="tablist">${tabList(s, o, bestOf(s)).map(([id, n]) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${id === tab}">${n}</button>`).join('')}</div>
      <div class="tabbody" id="tabbody" role="tabpanel">${tabBody(tab, o.k)}</div>
      <div class="acts">
        <button class="btn ghost" id="replay" aria-label="動きをもう一度再生">↻ 動き</button>
        <button class="btn" id="next">${last ? '結果を見る' : '次の問題へ'} →</button>
      </div>`;
  }

  function tabList(s, o, best) {
    const T = [['why', '理由'], ['ex', '解説'], ['key', '用語']];
    if (s.coach) T.push(['coach', '指導'], ['drill', '練習']);
    if (s.opts.some(x => x.k !== o.k && x.k !== best.k)) T.push(['rest', 'ほかの選択肢']);
    return T;
  }

  function tabBody(id, k = S.ans[S.qi].k) {
    const s = cur();
    const o = s.opts.find(x => x.k === k);
    const best = bestOf(s);
    const line = (x, tag) => `<p class="oline c${x.sc}"><span class="k k${x.sc}">${x.k}</span><span>${tag}${x.l}</span></p><p>${x.why}</p>`;
    switch (id) {
      case 'why':
        return line(o, 'あなたの選択：') + (o.k !== best.k ? line(best, 'ベスト：') : '');
      case 'ex': return `<p>${s.ex}</p>`;
      case 'key': return `<p class="term"><b class="hl">${s.key[0]}</b></p><p>${s.key[1]}</p>`;
      case 'coach': return `<p>${s.coach}</p>`;
      case 'drill': return `<p>${s.drill}</p>`;
      case 'rest': return s.opts.filter(x => x.k !== o.k && x.k !== best.k).map(x => line(x, `${RES[x.sc]}：`)).join('');
    }
    return '';
  }

  function setTab(id) {
    S.tab = id;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === id)));
    const b = document.getElementById('tabbody');
    b.innerHTML = tabBody(id); b.scrollTop = 0;
    phrase(b);
  }

  function choose(k) {
    if (S.done) return;
    const s = cur(), L = LV[S.lv];
    const o = s.opts.find(x => x.k === k); if (!o) return;
    S.done = true;
    S.ans[S.qi] = { k, sc: o.sc };
    const best = s.opts.reduce((a, b) => (b.sc > a.sc ? b : a));

    document.querySelectorAll('#pitch .og').forEach(g => {
      const kk = g.dataset.k, x = s.opts.find(y => y.k === kk);
      g.classList.add(kk === best.k ? 'r2' : kk === k ? 'r' + x.sc : 'dim');
    });
    document.getElementById('pitch').classList.add('answered');
    const stamp = document.getElementById('stamp');
    stamp.className = 'stamp v' + o.sc; stamp.textContent = `${k} · ${VERDICT[o.sc]} +${o.sc}点`; stamp.hidden = false;
    const hint = document.getElementById('hint'); if (hint) hint.hidden = true;
    document.getElementById('pt').textContent = total();
    document.querySelector('.dots').innerHTML = dots();

    const panel = document.getElementById('panel');
    panel.classList.add('is-fb');
    panel.innerHTML = fbHTML(s, o, 'why', S.qi === L.q.length - 1);
    phrase(panel);
    play(s);
  }

  function next() {
    const L = LV[S.lv];
    if (S.qi < L.q.length - 1) { S.qi++; question(); } else result();
  }

  /* ---------- 画面: 結果 ---------- */
  function result() {
    S.screen = 'result'; clearTimers();
    const L = LV[S.lv], sc = total(), mx = maxOf(L), pct = sc / mx;
    const best = loadBest(); const prev = best[L.id];
    const isNew = prev == null || sc > prev;
    if (isNew) { best[L.id] = sc; saveBest(best); }
    const msg = pct >= 0.85
      ? (S.lv === 2 ? '構造と言葉の両方で説明できるレベルです。' : '戦術眼あり。次のレベルへ進みましょう。')
      : pct >= 0.6 ? '原則はつかめています。「要注意」の問題を見直すとさらに伸びます。'
        : '原則をひとつずつ。解説を読んで、もう一度挑戦してみましょう。';
    app.innerHTML = `
    <div class="screen result">
      <div class="r-head">
        <p class="eyebrow">Lv.${L.no} ${L.name} · ${L.title}</p>
        <div class="score"><b>${sc}</b><span>/ ${mx}</span>${isNew ? '<em>自己ベスト</em>' : ''}</div>
        <p class="msg">${msg}</p>
      </div>
      <ol class="rlist">
        ${L.q.map((q, i) => {
          const a = S.ans[i] || { sc: 0 };
          return `<li><span class="chip c${a.sc}">${RES[a.sc]}</span><span class="rt"><b>${q.t}</b><small>${q.key[0]}</small></span></li>`;
        }).join('')}
      </ol>
      <div class="acts">
        <button class="btn ghost" id="retry">もう一度</button>
        ${S.lv < LV.length - 1 ? `<button class="btn" id="nextLv">Lv.${L.no + 1} ${LV[S.lv + 1].name}へ →</button>` : ''}
        <button class="btn ghost" id="toHome">レベル選択</button>
      </div>
    </div>`;
    phrase(app);
  }

  function start(i) { S.lv = i; S.qi = 0; S.ans = []; question(); }

  /* ---------- イベント ---------- */
  app.addEventListener('click', e => {
    const t = e.target;
    const st = t.closest('[data-start]'); if (st) return start(+st.dataset.start);
    const op = t.closest('.opt'); if (op) return choose(op.dataset.k);
    const og = t.closest('#pitch .og'); if (og && !S.done) return choose(og.dataset.k);
    const tb = t.closest('.tab'); if (tb) return setTab(tb.dataset.tab);
    const btn = t.closest('button'); const id = btn ? btn.id : '';
    if (id === 'back' || id === 'toHome') return home();
    if (id === 'next') return next();
    if (id === 'replay') return play(cur());
    if (id === 'retry') return start(S.lv);
    if (id === 'nextLv') return start(S.lv + 1);
    if (id === 'hintBtn') {
      const h = document.getElementById('hint'); h.hidden = !h.hidden;
      btn.setAttribute('aria-pressed', String(!h.hidden));
    }
  });
  document.addEventListener('keydown', e => {
    if (S.screen !== 'play' || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    if (!S.done && ['A', 'B', 'C'].includes(k)) choose(k);
    else if (S.done && (e.key === 'ArrowRight')) next();
  });
  addEventListener('resize', () => {
    const p = document.getElementById('panel');
    if (p && matchMedia(TWO_COL).matches) p.style.height = '';
  });

  home();
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
