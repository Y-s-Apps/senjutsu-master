<title>戦術マスター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* フォント: Dela Gothic One・Zen Kaku Gothic New・IBM Plex Mono（いずれも SIL OFL 1.1、licenses/ を参照）から、
   アプリで使う文字だけを収めたサブセット。dev/fonts/make_fonts.py が fonts/ に作る。外部（Google Fonts）へは通信しない */
@font-face { font-family: "TM Display"; src: url("fonts/tm-display-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "TM Gothic"; src: url("fonts/tm-gothic-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "TM Gothic"; src: url("fonts/tm-gothic-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "TM Gothic"; src: url("fonts/tm-gothic-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "TM Mono"; src: url("fonts/tm-mono-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "TM Mono"; src: url("fonts/tm-mono-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }

/* レイアウト: 1画面完結。戦術ボード（枠付きピッチ＋マグネット）が残りの高さを埋め、問題とフィードバックは下（横長なら右）のパネルにタブで収める */
/* 配色: 黒ベースの1テーマ（ユーザーの指定）。端末のライト/ダーク設定にかかわらず同じ見た目 */
:root {
  --bg: #0E1310; --surface: #161D18; --ink: #E6ECE4; --muted: #96A399; --line: #2A352D;
  --frame: #212A23; --frame-hi: #2C362E;
  --accent: #7D9CFF; --accent-ink: #0E1310;
  --good: #43C881; --ok: #E5B23A; --bad: #FF6D5E; --on-sem: #0E1310;
  --grass: #1E5634; --grass-2: #1A4D2E; --chalk: rgba(228, 239, 230, .78);
  --home: #3F6DF5; --away: #EE4A3B; --pen: #FFD43B; --pen-ink: #1B1A10;
  --p-good: #8DF7B8; --p-bad: #FF8B7B; --pen-mark: #FFD43B; --hl: rgba(255, 212, 59, .3);
  --f-disp: "TM Display", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-body: "TM Gothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-mono: "TM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}

/* 1画面に収める: html/body/#app を画面の高さに固定し、各画面の中だけで配分する */
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
/* 改行: 日本語は文節の境目（app.js の phrase() が <wbr> を入れる）だけで折り返す。収まらない長い語だけ途中で折る */
body { word-break: keep-all; overflow-wrap: anywhere; line-break: strict; }
p, .opt .l, .lv-who { text-wrap: pretty; }
h1, h2, .lead, .msg { text-wrap: balance; }
#app {
  height: 100%; max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.screen { height: 100%; min-height: 0; display: flex; flex-direction: column; }

.btn { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 10px 16px; border-radius: 10px; cursor: pointer; line-height: 1.4; transition: transform .12s, filter .12s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--accent); }
.link { appearance: none; background: none; border: 0; color: var(--accent); cursor: pointer; font-weight: 700; }
.eyebrow { font: 600 11px/1.4 var(--f-mono); letter-spacing: .14em; color: var(--muted); }

/* ホーム */
.home { gap: clamp(12px, 2.4vh, 22px); justify-content: center; overflow-y: auto; }
.h-side { display: flex; flex-direction: column; gap: clamp(10px, 2vh, 16px); }
.h-top h1 { font: 400 clamp(30px, 7.6vw, 60px)/1.12 var(--f-disp); margin-block: 6px 8px; text-wrap: balance; }
.lead { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 30em; }
.key { list-style: none; margin: 0; padding: 10px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 10px; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.key li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.key svg { width: 16px; height: 16px; flex: none; }
.key svg.wide { width: 26px; height: 9px; }
.k-home { fill: var(--home); } .k-away { fill: var(--away); }
.k-me { fill: none; stroke: var(--pen-mark); stroke-width: .5; stroke-dasharray: 1 .6; }
.k-ln { fill: none; stroke: var(--ink); stroke-width: .9; stroke-linecap: round; }
.k-dash { stroke-dasharray: 1.6 1.2; }
.k-hd { fill: var(--ink); }
.foot { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); line-height: 1.6; }
.foot-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.move-link { flex: none; white-space: nowrap; font-size: 12.5px; padding: 6px 0 1px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

/* 記録の引っこし（ホームの上に重ねる。スクロールさせずに1画面に収める） */
.sheet-bg { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(0, 0, 0, .62);
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(440px, 100%); max-height: 100%; overflow: hidden; display: flex; flex-direction: column; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px 14px; box-shadow: 0 18px 40px -20px rgba(0, 0, 0, .8); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { font: 400 19px/1.3 var(--f-disp); }
.sheet-x { font-size: 24px; line-height: 1; padding: 2px 6px; color: var(--muted); }
.sheet-sub { font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.mv-now { font: 600 12.5px/1.5 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; }
.sheet-h { margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
.mv-row { display: flex; gap: 8px; }
.mv-row > .btn { flex: 1 1 0; padding: 9px 10px; }
.mv-row > .mv-code { flex: 1 1 auto; }
.mv-row > #mvTake { flex: none; }
.btn:disabled { opacity: .4; cursor: default; filter: none; transform: none; }
/* 入力欄は 16px（iPhone で拡大されないように） */
.mv-code { min-width: 0; width: 100%; font: 500 16px/1.3 var(--f-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.mv-out { resize: none; word-break: break-all; overflow: hidden; }
.mv-code::placeholder { color: var(--muted); font-family: var(--f-body); font-size: 14px; }
.mv-file { position: relative; text-align: center; }
.mv-file input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.mv-file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.mv-msg { min-height: 2.9em; font-size: 12.5px; line-height: 1.5; color: var(--ink); }
.levels { display: flex; flex-direction: column; gap: 10px; }
.lv { appearance: none; display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px 11px; cursor: pointer; line-height: 1.5; transition: border-color .15s, transform .12s; }
.lv:hover { border-color: var(--accent); }
.lv:active { transform: translateY(1px); }
.lv > span { display: block; min-width: 0; }
.lv .lv-head { display: flex; align-items: center; gap: 9px; }
.pips { display: flex; gap: 3px; flex: none; }
.pips i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--home); }
.pips i.on { background: var(--home); }
.lv-name { flex: none; font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.lv-title { min-width: 0; font: 400 19px/1.35 var(--f-disp); }
.lv-best { margin-left: auto; flex: none; font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lv-best b { font: 600 16px var(--f-mono); color: var(--ink); margin-left: 4px; }
.lv .lv-who { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 12.5px; color: var(--muted); }
.lv-tag { white-space: nowrap; font-size: 11px; font-weight: 700; color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; line-height: 1.6; }
.lv-topics { font-size: 12px; color: var(--ink); opacity: .8; text-wrap: balance; }
.lv-topics span { white-space: nowrap; margin-right: 6px; }
.lv-topics span::before { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: 3px; }

/* 問題画面 */
.play { gap: 8px; }
.bar { display: flex; align-items: center; gap: 10px; min-height: 30px; flex: none; }
.back { font-size: 19px; padding: 0 4px 0 0; line-height: 1; }
.bar-lv { font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.dots { flex: 1; list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; min-width: 40px; }
.dots li { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.dots li.now { background: var(--accent); }
.dots li.r2 { background: var(--good); } .dots li.r1 { background: var(--ok); } .dots li.r0 { background: var(--bad); }
.bar-q, .bar-pt { font: 600 13px var(--f-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar-q small, .bar-pt { color: var(--muted); }
.bar-pt b { color: var(--ink); font-size: 15px; }

.stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.board-area { flex: 1 1 auto; min-height: 140px; container-type: size; display: grid; place-items: center; }
.board { --fp: 6px; position: relative; padding: var(--fp); border-radius: 12px; background: linear-gradient(160deg, var(--frame-hi), var(--frame)); box-shadow: 0 1px 0 var(--line), 0 12px 24px -16px rgba(0, 0, 0, .45); width: min(100cqw, calc((100cqh - 2 * var(--fp)) * var(--ar) + 2 * var(--fp))); }
#pitch { display: block; width: 100%; height: auto; border-radius: 7px; background: var(--grass); }
.dir { position: absolute; right: 12px; top: 11px; font: 600 10.5px var(--f-mono); color: var(--pen); background: rgba(0, 0, 0, .38); padding: 1px 8px; border-radius: 99px; pointer-events: none; }
.stamp { position: absolute; left: 12px; top: 10px; white-space: nowrap; font-weight: 700; font-size: 13px; padding: 3px 12px; box-shadow: 0 4px 12px -6px rgba(0, 0, 0, .6); border-radius: 99px; color: var(--on-sem); pointer-events: none; }
.stamp.v2 { background: var(--good); } .stamp.v1 { background: var(--ok); } .stamp.v0 { background: var(--bad); }
.hint-cap { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.5; box-shadow: 0 6px 16px -8px rgba(0, 0, 0, .5); }

.panel { flex: 0 0 auto; max-height: 66%; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.panel.is-fb { overflow: hidden; }
.qhead { display: flex; align-items: center; gap: 8px; }
.phase { flex: none; font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 99px; color: var(--on-sem); line-height: 1.6; }
.ph-atk { background: var(--home); color: #FFFFFF; } .ph-def { background: var(--away); color: #FFFFFF; }
.ph-tr { background: var(--ok); } .ph-coach { background: var(--ink); color: var(--bg); }
.qt { flex: 1; min-width: 0; font: 400 18px/1.3 var(--f-disp); text-wrap: balance; }
.hint-btn { flex: none; appearance: none; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); border-radius: 99px; padding: 1px 11px; font-size: 12px; font-weight: 700; cursor: pointer; }
.hint-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sit { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
.qq { font-weight: 700; font-size: 15px; line-height: 1.5; }
.opts { display: grid; gap: 6px; margin-top: auto; }
.opt { appearance: none; display: flex; align-items: center; gap: 10px; min-height: 44px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 11px; padding: 7px 12px; cursor: pointer; font-size: 14px; line-height: 1.45; transition: border-color .15s; }
.opt:hover { border-color: var(--accent); }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--pen); color: var(--pen-ink); font: 600 13px var(--f-mono); }

.tabs { flex: none; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 2.5px solid transparent; margin-bottom: -1px; padding: 4px 10px 6px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 14px; line-height: 1.65; padding-top: 2px; }
.oline { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; line-height: 1.45; }
.oline .k { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--f-mono); color: var(--on-sem); }
.k2 { background: var(--good); } .k1 { background: var(--ok); } .k0 { background: var(--bad); }
.oline + p + .oline { margin-top: 6px; }
.term .hl { font-size: 19px; background: linear-gradient(transparent 58%, var(--hl) 58%); padding-inline: 2px; }
.acts { flex: none; display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { padding: 9px 14px; }
.play .acts .btn:last-child { flex: 1 1 auto; }

/* 結果 */
.result { gap: clamp(10px, 2vh, 18px); justify-content: center; overflow-y: auto; max-width: 620px; width: 100%; margin-inline: auto; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.score b { font: 400 clamp(52px, 11vh, 88px)/1 var(--f-disp); font-variant-numeric: tabular-nums; }
.score span { font: 600 20px var(--f-mono); color: var(--muted); }
.score em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--pen-ink); background: var(--pen); padding: 2px 10px; border-radius: 99px; }
.msg { font-size: 15px; font-weight: 500; line-height: 1.6; margin-top: 6px; }
.rlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rlist li { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.chip { font-size: 11.5px; font-weight: 700; text-align: center; padding: 1px 0; border-radius: 99px; color: var(--on-sem); white-space: nowrap; }
.chip.c2 { background: var(--good); } .chip.c1 { background: var(--ok); } .chip.c0 { background: var(--bad); }
.rt { display: flex; flex-direction: column; min-width: 0; line-height: 1.4; }
.rt b { font-size: 14px; }
.rt small { font-size: 12px; color: var(--muted); }

/* 背の低い画面: ホームとフィードバックの文字・余白を少し詰める */
@media (max-height: 660px) {
  .home { gap: 10px; }
  .h-side { gap: 8px; }
  .h-top h1 { font-size: 27px; margin-block: 0 4px; }
  .lead { font-size: 13px; line-height: 1.5; }
  .key { padding: 7px 10px; gap: 2px 10px; }
  .foot { font-size: 11.5px; line-height: 1.5; }
  .levels { gap: 8px; }
  .lv { padding: 8px 12px 9px; gap: 1px; }
  .lv-title { font-size: 17px; }
  .move-link { font-size: 12px; padding: 4px 0 0; }
  .sheet { gap: 5px; padding: 10px 14px 12px; }
  .sheet-sub { font-size: 12px; line-height: 1.5; }
}
@media (max-height: 700px) {
  .tabbody { font-size: 13.5px; line-height: 1.52; gap: 4px; }
  .oline { font-size: 12.5px; }
  .sit { font-size: 13px; line-height: 1.55; }
}

/* 横長の画面: ボードを左、問題を右に並べる */
@media (min-width: 720px) and (min-aspect-ratio: 5/4) {
  .stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, 1fr); grid-template-rows: minmax(0, 1fr); gap: 24px; }
  .board-area { min-height: 0; height: 100%; }
  .panel { max-height: none; height: 100%; justify-content: center; gap: 10px; }
  .panel.is-fb { justify-content: flex-start; padding-top: 8px; }
  .opts { margin-top: 0; }
  .qt { font-size: 24px; } .sit { font-size: 14.5px; } .qq { font-size: 16.5px; }
  .opt { font-size: 15px; padding: 10px 14px; }
  .tabbody { font-size: 15px; }
  .home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-content: center; align-items: center; column-gap: 48px; }
}

/* ピッチ内 SVG */
.grass { fill: var(--grass); } .mow { fill: var(--grass-2); }
.chalk * { fill: none; stroke: var(--chalk); stroke-width: .22; }
.spots { fill: var(--chalk); }
.goal rect { fill: var(--chalk); fill-opacity: .14; stroke: var(--chalk); stroke-width: .22; }
.lanes line { stroke: var(--chalk); stroke-width: .18; stroke-dasharray: .8 .8; opacity: .7; }
.lanes text { fill: var(--chalk); font: 500 1.5px var(--f-body); text-anchor: middle; opacity: .85; }
.offside line { stroke: var(--p-bad); stroke-width: .25; stroke-dasharray: 1 .7; }
.offside text { fill: var(--p-bad); font: 700 1.5px var(--f-body); }

.og { color: var(--pen); cursor: pointer; transition: opacity .3s; }
.answered .og { cursor: default; }
.og .ln { fill: none; stroke: currentColor; stroke-width: .42; stroke-linecap: round; stroke-linejoin: round; }
.og .k-run { stroke-dasharray: 1.2 .9; }
.og .k-look { stroke-dasharray: .05 .85; stroke-width: .55; }
.og .hd { fill: currentColor; }
.og .ring { fill: currentColor; fill-opacity: .12; stroke: currentColor; stroke-width: .32; stroke-dasharray: .9 .6; }
.bdg circle { fill: currentColor; stroke: rgba(0, 0, 0, .35); stroke-width: .25; }
.bdg .hit { fill: transparent; stroke: none; pointer-events: all; }
.answered .bdg .hit { pointer-events: none; }
.bdg text { pointer-events: none;  fill: var(--pen-ink); font: 600 2.1px var(--f-mono); text-anchor: middle; }
.og:hover .bdg circle:not(.hit) { stroke: var(--pen-ink); stroke-width: .4; }
.og.r2 { color: var(--p-good); } .og.r2 .ln { stroke-width: .6; }
.og.r1 { color: var(--pen); } .og.r0 { color: var(--p-bad); }
.og.dim { opacity: .18; }

.pl, .ball { transition: transform .85s cubic-bezier(.45, .05, .25, 1); }
.ball { transition-duration: .7s; }
.snap .pl, .snap .ball { transition: none; }
.mag { stroke: rgba(0, 0, 0, .4); stroke-width: .25; }
.t-h .mag { fill: var(--home); } .t-a .mag { fill: var(--away); }
.gk .mag { stroke: var(--chalk); stroke-width: .45; }
.shine { fill: #FFFFFF; opacity: .26; }
.num { fill: #FFFFFF; font: 600 2.05px var(--f-mono); text-anchor: middle; }
.me-ring { fill: none; stroke: var(--pen); stroke-width: .42; stroke-dasharray: 1 .65; transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
.me-lb { fill: var(--pen); font: 700 1.7px var(--f-body); text-anchor: middle; paint-order: stroke; stroke: rgba(0, 0, 0, .55); stroke-width: .45; }
.ball circle { fill: #FFFFFF; stroke: #141414; stroke-width: .2; }
.ball .bp { fill: #141414; stroke: none; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .pl, .ball, .og, .btn, .lv { transition: none; }
  .me-ring { animation: none; }
}
</style>
