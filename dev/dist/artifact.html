/* レイアウト: 1画面完結。戦術ボード（枠付きピッチ＋マグネット）が残りの高さを埋め、問題とフィードバックは下（横長なら右）のパネルにタブで収める */
/* 配色: 黒ベースの1テーマ（ユーザーの指定）。端末のライト/ダーク設定にかかわらず同じ見た目 */
:root {
  /* 色: 色味のない黒〜グレー。色は意味のあるもの（味方・相手・判定・ペン）だけに使い、強い色はペンの色（--pen）1つ。
     ボードは明るめの枠にはめた黒いボードに、チョークの線（2026-10-30 の候補 B） */
  --bg: #0B0B0B; --surface: #141414; --raise: #1C1C1C; --line: #252525; --line-2: #343434;
  --ink: #F1F1EE; --muted: #8E8E89; --faint: #74746F;
  --primary: #FFD43B; --primary-ink: #15130A; --focus: #FFD43B; --tab: #FFD43B;
  --good: #4CC38A; --ok: #E2B04A; --bad: #F06A5A; --set: #A991F5;
  --frame: #2A2A2A; --frame-line: #363636;
  --grass: #1E2220; --chalk: rgba(242, 242, 236, .74);
  --home: #4C7DFF; --away: #EF5547; --pen: #FFD43B; --pen-ink: #15130A;
  /* お気に入りクラブ: 味方のマグネットの内側の縁と、相手の灰色（クラブカラーはデータの color から） */
  --rim-in: #FFFFFF; --fav-away: #8C8C8C;
  --p-good: #8DF0B6; --p-bad: #FF8E80; --hl: rgba(245, 207, 77, .28);
  --f-brand: "TM Display", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-disp: "TM Gothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-body: "TM Gothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-mono: "TM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --w-brand: 400; --w-disp: 700; --w-bold: 700;
  color-scheme: dark;
}

/* 1画面に収める: html/body/#app を画面の高さに固定し、各画面の中だけで配分する */
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
/* 改行: 日本語は文節の境目（app.js の phrase() が <wbr> を入れる）だけで折り返す。収まらない長い語だけ途中で折る */
body { word-break: keep-all; overflow-wrap: anywhere; line-break: strict; }
p, .opt .l, .lv-w { text-wrap: pretty; }
h1, h2, .lead, .msg { text-wrap: balance; }
#app {
  height: 100%; max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.screen { height: 100%; min-height: 0; display: flex; flex-direction: column; }
/* 線のアイコン: どれも 16px・同じ線の幅 */
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--primary); background: var(--primary); color: var(--primary-ink); font-weight: var(--w-bold); padding: 10px 16px; border-radius: 10px; cursor: pointer; line-height: 1.4; transition: background-color .15s, border-color .15s, opacity .15s; }
.btn:hover { opacity: .9; }
.btn:active { opacity: .8; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--raise); opacity: 1; }
.link { appearance: none; background: none; border: 0; color: var(--muted); cursor: pointer; font-weight: var(--w-bold); }
.link:hover { color: var(--ink); }
.eyebrow { font-size: 12.5px; line-height: 1.5; color: var(--muted); }

/* ホーム */
.home { gap: clamp(14px, 2.6vh, 24px); justify-content: center; overflow-y: auto; }
.h-side { display: flex; flex-direction: column; gap: clamp(12px, 2vh, 16px); }
.h-top h1 { font: var(--w-brand) clamp(30px, 7.6vw, 58px)/1.15 var(--f-brand); margin: 0 0 8px; text-wrap: balance; }
.lead { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 30em; }
.key { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.key li { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.key svg { width: 14px; height: 14px; flex: none; }
.key svg.wide { width: 22px; height: 8px; }
.k-home { fill: var(--home); } .k-away { fill: var(--away); }
.k-me { fill: none; stroke: var(--pen); stroke-width: .5; stroke-dasharray: 1 .6; }
.k-ln { fill: none; stroke: var(--ink); stroke-width: .9; stroke-linecap: round; }
.k-dash { stroke-dasharray: 1.6 1.2; }
.k-hd { fill: var(--ink); }
.foot { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); line-height: 1.6; }
.foot-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.nw { white-space: nowrap; }
.move-link { flex: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12.5px; padding: 6px 0 1px; }

/* レベルのリスト: 枠は2つだけ（レベル3つ / 名将の戦術・前節の一戦）。中は細い線で分ける */
.levels { display: flex; flex-direction: column; gap: 10px; }
.grp { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.lv { appearance: none; display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 10px 14px 11px; cursor: pointer; line-height: 1.5; transition: background-color .15s; }
.lv:first-child { border-top: 0; }
.lv:hover { background: var(--raise); }
.lv > span { display: block; min-width: 0; }
.lv .lv-head { display: flex; align-items: center; gap: 10px; }
.pips { display: flex; gap: 3px; flex: none; }
.pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); }
.pips i.on { background: var(--ink); }
.lv-name { flex: none; font-size: 12px; font-weight: var(--w-bold); color: var(--pen); }
.lv-title { min-width: 0; font: var(--w-disp) 17px/1.35 var(--f-disp); }
.lv-best { margin-left: auto; flex: none; font: 500 12px var(--f-mono); color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lv-best small { font: 500 11px var(--f-body); color: var(--muted); margin-right: 6px; }
.lv-best b { font: 600 15px var(--f-mono); color: var(--ink); }
.lv .lv-who { display: flex; align-items: flex-start; gap: 12px; font-size: 12.5px; color: var(--muted); padding-left: 34px; }
.lv-w { flex: 1 1 auto; min-width: 0; }
.lv-n { flex: none; margin-left: auto; white-space: nowrap; font: 500 11.5px/1.65 var(--f-mono); color: var(--faint); }
.lv:disabled { cursor: default; opacity: .55; }
.lv:disabled:hover { background: none; }
/* 名将の戦術（作戦ボードの線アイコン）と前節の一戦（色の点）。レベルの「●●○」と同じ幅 */
.ico { flex: none; width: 24px; display: flex; align-items: center; color: var(--muted); }
.ico .club-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid var(--r); }
.ico .club-dot.none { background: none; border: 1.5px dashed var(--muted); }
/* お気に入りクラブ: ホームのカードの「変える」と、クラブを選ぶ画面 */
.lv-fav { position: relative; border-top: 1px solid var(--line); }
.lv-fav .lv { border-top: 0; }
.lv-fav .lv-who { padding-right: 48px; }
.lv-chg { position: absolute; right: 6px; bottom: 4px; font-size: 12px; padding: 6px 8px; }
.pick { gap: 12px; }
.pk-body { flex: 1; min-height: 0; width: 100%; max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; justify-content: center; gap: clamp(14px, 3vh, 24px); }
.pk-top h2 { font: var(--w-disp) 22px/1.35 var(--f-disp); margin-bottom: 6px; text-wrap: balance; }
.pk-lead { color: var(--muted); font-size: 13.5px; line-height: 1.6; text-wrap: pretty; }
.pk-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pk-club { appearance: none; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: background-color .15s, border-color .15s; }
.pk-club:hover { background: var(--raise); }
.pk-club.on { border-color: var(--pen); }
.cmag { width: 34px; height: 34px; margin-bottom: 2px; }
.cmag.sm { width: 14px; height: 14px; margin: 0; }
.cmag .cm { fill: var(--c); stroke: var(--rim-in); stroke-width: .34; }
.cmag .cm-r { fill: none; stroke: var(--r); stroke-width: .5; }
.pk-place { font-size: 11px; color: var(--muted); line-height: 1.3; white-space: nowrap; }
.pk-name { font-size: 14px; font-weight: var(--w-bold); line-height: 1.3; white-space: nowrap; }
.pk-best { font: 500 11px var(--f-mono); color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pk-best b { font-weight: 600; color: var(--ink); }
.pk-foot { display: flex; flex-direction: column; gap: 8px; }
.pk-key { grid-template-columns: repeat(2, max-content); }
.k-gray { fill: var(--fav-away); }
.pk-note { font-size: 12px; color: var(--muted); line-height: 1.6; }
@media (max-width: 380px) { .pk-name { font-size: 13px; } }
/* お気に入りクラブのボード: 味方はクラブカラーの地に「白と縁の色の二重の縁」、GK は今の GK の見た目、相手は灰色（データの color） */
.club .t-h:not(.gk) .mag { stroke: var(--rim-in); stroke-width: .34; }
.rr { display: none; }
.club .t-h:not(.gk) .rr { display: inline; fill: none; stroke: var(--rim); stroke-width: .42; }
.ico.live i { width: 7px; height: 7px; margin-left: 1px; border-radius: 50%; background: var(--good); }

/* 記録の引っこし（ホームの上に重ねる。スクロールさせずに1画面に収める） */
.sheet-bg { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(0, 0, 0, .66);
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(440px, 100%); max-height: 100%; overflow: hidden; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { font: var(--w-disp) 18px/1.3 var(--f-disp); }
.sheet-x { display: grid; place-items: center; width: 32px; height: 32px; margin-right: -8px; }
.sheet-sub { font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.mv-now { font: 500 12.5px/1.5 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.sheet-h { margin: 4px 0 0; font-size: 12px; font-weight: var(--w-bold); color: var(--muted); }
.mv-row { display: flex; gap: 8px; }
.mv-row > .btn { flex: 1 1 0; padding: 9px 10px; }
.mv-row > .mv-code { flex: 1 1 auto; }
.mv-row > #mvTake { flex: none; }
.btn:disabled { opacity: .4; cursor: default; }
/* 入力欄は 16px（iPhone で拡大されないように） */
.mv-code { min-width: 0; width: 100%; font: 500 16px/1.3 var(--f-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.mv-out { resize: none; word-break: break-all; overflow: hidden; }
.mv-code::placeholder { color: var(--faint); font-family: var(--f-body); font-size: 14px; }
.mv-file { position: relative; text-align: center; }
.mv-file input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.mv-file:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.mv-msg { min-height: 2.9em; font-size: 12.5px; line-height: 1.5; color: var(--ink); }

/* 問題画面 */
.play { gap: 8px; }
.bar { display: flex; align-items: center; gap: 10px; min-height: 32px; flex: none; }
.back { display: grid; place-items: center; width: 32px; height: 32px; margin-left: -8px; }
.back .i { width: 18px; height: 18px; }
.bar-lv { font-weight: var(--w-bold); font-size: 12.5px; white-space: nowrap; }
.dots { flex: 1; list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; min-width: 40px; }
.dots li { flex: 1; height: 4px; border-radius: 2px; background: var(--line-2); }
.dots li.now { background: var(--pen); }
.dots li.r2 { background: var(--good); } .dots li.r1 { background: var(--ok); } .dots li.r0 { background: var(--bad); }
.bar-q, .bar-pt { font: 500 13px var(--f-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar-q small, .bar-pt { color: var(--muted); }
.bar-pt b { color: var(--ink); font-weight: 600; }

.stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.board-area { flex: 1 1 auto; min-height: 140px; container-type: size; display: grid; place-items: center; }
.board { --fp: 5px; position: relative; padding: var(--fp); border-radius: 12px; background: var(--frame); border: 1px solid var(--frame-line); width: min(100cqw, calc((100cqh - 2 * var(--fp) - 2px) * var(--ar) + 2 * var(--fp) + 2px)); }
#pitch { display: block; width: 100%; height: auto; border-radius: 8px; background: var(--grass); }
.dir { position: absolute; right: 12px; top: 11px; font: 500 10.5px var(--f-mono); color: var(--ink); background: rgba(10, 10, 11, .55); padding: 1px 7px; border-radius: 6px; pointer-events: none; }
.stamp { position: absolute; left: 12px; top: 10px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-weight: var(--w-bold); font-size: 12.5px; padding: 4px 10px; border-radius: 8px; color: var(--ink); background: rgba(14, 14, 15, .9); border: 1px solid var(--line-2); pointer-events: none; }
.stamp i { width: 7px; height: 7px; border-radius: 50%; }
.stamp b { font: 600 12px var(--f-mono); color: var(--muted); margin-left: 2px; }
.stamp.v2 i { background: var(--good); } .stamp.v1 i { background: var(--ok); } .stamp.v0 i { background: var(--bad); }
.hint-cap { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--raise); border: 1px solid var(--line-2); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.5; }

.panel { flex: 0 0 auto; max-height: 66%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel.is-fb { overflow: hidden; }
.qhead { display: flex; align-items: center; gap: 10px; }
.phase { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: var(--w-bold); color: var(--muted); line-height: 1.6; }
.phase i { width: 7px; height: 7px; border-radius: 50%; }
.ph-atk i { background: var(--home); } .ph-def i { background: var(--away); }
.ph-tr i { background: var(--ok); } .ph-coach i { background: var(--ink); } .ph-set i { background: var(--set); }
.diff { flex: none; display: flex; }
.diff .pips i { width: 6px; height: 6px; }
/* 名将の戦術・前節の一戦: 実在の文脈（国・年代・大会）と、架空のクラブ名（監督名）を並べる（バッジにしない） */
.ctx { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 12px; font-weight: var(--w-bold); line-height: 1.45; color: var(--ink); }
.ctx-tag { flex: none; white-space: nowrap; color: var(--muted); }
.qt { flex: 1; min-width: 0; font: var(--w-disp) 17px/1.35 var(--f-disp); text-wrap: balance; }
.hint-btn { flex: none; appearance: none; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-2); background: transparent; color: var(--muted); border-radius: 8px; padding: 2px 8px 2px 6px; font-size: 12px; font-weight: var(--w-bold); cursor: pointer; }
.hint-btn .i { width: 14px; height: 14px; }
.hint-btn[aria-pressed="true"] { color: var(--pen); border-color: var(--pen); }
.sit { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
.qq { font-weight: var(--w-bold); font-size: 15px; line-height: 1.5; }
.opts { display: grid; gap: 6px; margin-top: auto; }
.opt { appearance: none; display: flex; align-items: center; gap: 10px; min-height: 44px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 14px; line-height: 1.45; transition: background-color .15s, border-color .15s; }
.opt:hover { background: var(--raise); border-color: var(--line-2); }
/* 記号 A/B/C はキーの形（ボードの印と同じペンの色） */
.opt .k, .kc { flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--raise); border: 1px solid var(--line-2); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .35); color: var(--pen); font: 600 12.5px var(--f-mono); }

.tabs { flex: none; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 4px 10px 6px; font-size: 13px; font-weight: var(--w-bold); color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tab); }
.tabbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 14px; line-height: 1.65; padding-top: 2px; }
.oline { display: flex; align-items: center; gap: 8px; font-weight: var(--w-bold); font-size: 13px; line-height: 1.45; }
.oline .kc { width: 22px; height: 22px; font-size: 12px; }
.oline.c2 .kc { color: var(--good); } .oline.c1 .kc { color: var(--ok); } .oline.c0 .kc { color: var(--bad); }
.oline + p + .oline { margin-top: 6px; }
.term .hl { font-size: 19px; background: linear-gradient(transparent 58%, var(--hl) 58%); padding-inline: 2px; }
.acts { flex: none; display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { padding: 9px 14px; }
.play .acts .btn:last-child { flex: 1 1 auto; }

/* 結果 */
.result { gap: clamp(12px, 2.2vh, 20px); justify-content: center; overflow-y: auto; max-width: 620px; width: 100%; margin-inline: auto; }
.score { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.score b { font: var(--w-brand) clamp(56px, 12vh, 96px)/1 var(--f-brand); font-variant-numeric: tabular-nums; }
.score span { font: 500 24px var(--f-mono); color: var(--faint); }
.score em { align-self: center; display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; font-style: normal; font-size: 12.5px; font-weight: var(--w-bold); color: var(--pen); }
.score em i { width: 7px; height: 7px; border-radius: 50%; background: var(--pen); }
.msg { font-size: 15px; font-weight: 500; line-height: 1.6; margin-top: 8px; }
.msg-live { font-size: 13.5px; color: var(--muted); }
.rlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.rv { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: var(--w-bold); color: var(--muted); white-space: nowrap; }
.rv i { width: 7px; height: 7px; border-radius: 50%; }
.rv.c2 i { background: var(--good); } .rv.c1 i { background: var(--ok); } .rv.c0 i { background: var(--bad); }
.rt { display: flex; flex-direction: column; min-width: 0; line-height: 1.4; }
.rt b { font-size: 14px; font-weight: var(--w-bold); }
.rt small { font-size: 12px; color: var(--muted); }

/* 幅の狭い画面: レベルの問題数を出さず、説明を1行に収める */
@media (max-width: 380px) {
  .lv-n { display: none; }
}
/* 背の低い画面: ホームとフィードバックの文字・余白を少し詰める */
@media (max-height: 660px) {
  .home { gap: 10px; }
  .h-side { gap: 8px; }
  .h-top h1 { font-size: 27px; margin: 0 0 4px; }
  .lead { font-size: 13px; line-height: 1.5; }
  .key { gap: 3px 10px; }
  .foot { font-size: 11.5px; line-height: 1.5; }
  .levels { gap: 8px; }
  .lv { padding: 8px 12px 9px; gap: 1px; }
  .lv-title { font-size: 16px; }
  .move-link { font-size: 12px; padding: 4px 0 0; }
  .panel { gap: 6px; }
  .sheet { gap: 5px; padding: 10px 14px 12px; }
  .sheet-sub { font-size: 12px; line-height: 1.5; }
}
@media (max-height: 700px) {
  .tabbody { font-size: 13.5px; line-height: 1.52; gap: 4px; }
  .oline { font-size: 12.5px; }
  .sit { font-size: 13px; line-height: 1.55; }
}

/* 横長の画面: ボードを左、問題を右に並べる */
@media (min-width: 720px) and (min-aspect-ratio: 5/4) {
  .stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, 1fr); grid-template-rows: minmax(0, 1fr); gap: 24px; }
  .board-area { min-height: 0; height: 100%; }
  .panel { max-height: none; height: 100%; justify-content: center; gap: 10px; }
  .panel.is-fb { justify-content: flex-start; padding-top: 8px; }
  .opts { margin-top: 0; }
  .qt { font-size: 23px; } .sit { font-size: 14.5px; } .qq { font-size: 16.5px; }
  .opt { font-size: 15px; padding: 10px 14px; }
  .tabbody { font-size: 15px; }
  .home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-content: center; align-items: center; column-gap: 48px; }
}

/* ピッチ内 SVG */
.grass { fill: var(--grass); }
.chalk * { fill: none; stroke: var(--chalk); stroke-width: .22; }
.spots { fill: var(--chalk); }
.goal rect { fill: var(--chalk); fill-opacity: .14; stroke: var(--chalk); stroke-width: .22; }
.lanes line { stroke: var(--chalk); stroke-width: .18; stroke-dasharray: .8 .8; opacity: .7; }
.lanes text { fill: var(--chalk); font: 500 1.5px var(--f-body); text-anchor: middle; opacity: .85; }
.offside line { stroke: var(--p-bad); stroke-width: .25; stroke-dasharray: 1 .7; }
.offside text { fill: var(--p-bad); font: 700 1.5px var(--f-body); }

.og { color: var(--pen); cursor: pointer; transition: opacity .3s; }
.answered .og { cursor: default; }
.og .ln { fill: none; stroke: currentColor; stroke-width: .42; stroke-linecap: round; stroke-linejoin: round; }
.og .k-run { stroke-dasharray: 1.2 .9; }
.og .k-look { stroke-dasharray: .05 .85; stroke-width: .55; }
.og .hd { fill: currentColor; }
.og .ring { fill: currentColor; fill-opacity: .12; stroke: currentColor; stroke-width: .32; stroke-dasharray: .9 .6; }
.bdg circle { fill: currentColor; stroke: rgba(0, 0, 0, .35); stroke-width: .2; }
.bdg .hit { fill: transparent; stroke: none; pointer-events: all; }
.answered .bdg .hit { pointer-events: none; }

<script>
// 出題の仕組み: 問題の選び方・選択肢の並べ替え・「前節」の決め方。
// 画面には触らない関数だけを置く（app.js が使い、dev/test/logic.js が node で確かめる）。
(() => {
  'use strict';
  const SESSION = 6; // 1回に出す問題の数（自己ベストの満点は 6×2=12 点）

  const shuffle = (a, rnd = Math.random) => {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
    return b;
  };

  // 選択肢の並べ替え: 中身はそのままで、表示の記号（A/B/C）だけを並び順に振り直す。元のデータは変えない。
  const prep = (q, rnd = Math.random) => ({ ...q, opts: shuffle(q.opts, rnd).map((o, i) => ({ ...o, k: 'ABC'[i] })) });

  // 出す問題を選ぶ。hist は出した問題の id（古い→新しい）。
  //  1) 直近に出した問題は出さない: 最後の max(n, 全体−n−2) 問。ただし候補が n 問を切らない範囲で
  //  2) 候補のうち古いもの（まだ出ていないものが先）から n+2 問ほどに絞る（同じ古さはすべて残す）
  //  3) まだ出ていない問題 → 場面（攻撃・守備・切り替え…）が少ないもの → 古いもの → ランダム、の順に選ぶ
  //  4) 選んだ問題の出題順もシャッフル
  function pick(pool, n, hist = [], rnd = Math.random) {
    n = Math.min(n, pool.length);
    const known = new Set(pool.map(q => q.id));
    const h = hist.filter(id => known.has(id));
    const age = new Map(h.map((id, i) => [id, i])); // 大きいほど最近
    const ageOf = q => (age.has(q.id) ? age.get(q.id) : -1);
    const nb = Math.min(h.length, Math.max(n, pool.length - n - 2), pool.length - n);
    const block = new Set(h.slice(h.length - nb));
    const cand = shuffle(pool.filter(q => !block.has(q.id)), rnd).sort((a, b) => ageOf(a) - ageOf(b));
    const cut = cand.length > n + 2 ? ageOf(cand[n + 1]) : Infinity;
    const left = cand.filter(q => ageOf(q) <= cut).map(q => ({ q, r: rnd() }));
    const count = {}, out = [];
    while (out.length < n && left.length) {
      left.sort((x, y) => (age.has(x.q.id) - age.has(y.q.id)) || ((count[x.q.ph] || 0) - (count[y.q.ph] || 0)) || (ageOf(x.q) - ageOf(y.q)) || (x.r - y.r));
      const { q } = left.shift();
      out.push(q);
      count[q.ph] = (count[q.ph] || 0) + 1;
    }

      g += `<g class="pl t-${t}${gk ? ' gk' : ''}${me ? ' me' : ''}" data-id="${id}" style="transform:translate(${x}px,${y}px)">` +
        (me ? '<circle class="me-ring" r="3.2"/>' : '') +
        `<circle class="mag" r="2"/>${t === 'h' && S.deck && S.deck.fav ? '<circle class="rr" r="2.38"/>' : ''}<text class="num" y=".74">${n}</text>` +
        (me ? '<text class="me-lb" y="-3.9">あなた</text>' : '') + '</g>';
    };
    s.a.forEach(p => add('a', p));
    s.h.forEach(p => add('h', p));
    return g;
  }

  const ballXY = p => `translate(${f(p[0] + BO[0])}px,${f(p[1] + BO[1])}px)`;

  function pitchSVG(s) {
    const v = s.view;
    const label = `${PH[s.ph]}の場面。${S.deck && S.deck.fav ? 'クラブの色が味方、灰色が相手' : '青が味方、赤が相手'}。味方は上に向かって攻めている。`;
    return `<svg id="pitch" viewBox="${v.join(' ')}" role="img" aria-label="${label}">
      ${field()}${s.lanes ? lanes(v) : ''}${s.line ? offside(s.line) : ''}
      <g class="opts-g">${s.opts.map(optG).join('')}</g>
      <g class="pls">${players(s)}</g>
      <g class="ball" style="transform:${ballXY(s.ball)}"><circle r=".95"/><circle class="bp" r=".38"/></g>
    </svg>`;
  }

  /* ---------- アニメーション ---------- */
  function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; }
  function placeAll(s) {
    const svg = document.getElementById('pitch'); if (!svg) return;
    svg.classList.add('snap');
    [['a', s.a], ['h', s.h]].forEach(([t, arr]) => arr.forEach(([n, x, y]) => {
      const el = svg.querySelector(`[data-id="${t}${n}"]`); if (el) el.style.transform = `translate(${x}px,${y}px)`;
    }));
    svg.querySelector('.ball').style.transform = ballXY(s.ball);
    void svg.getBoundingClientRect();
    svg.classList.remove('snap');
  }
  function play(s) {
    clearTimers(); placeAll(s);
    const svg = document.getElementById('pitch');
    const gap = reduce ? 700 : 1050;
    s.play.forEach((st, i) => {
      S.timers.push(setTimeout(() => {
        if (!svg.isConnected) return;
        Object.entries(st.m || {}).forEach(([id, [x, y]]) => {
          const el = svg.querySelector(`[data-id="${id}"]`); if (el) el.style.transform = `translate(${x}px,${y}px)`;
        });
        if (st.b) svg.querySelector('.ball').style.transform = ballXY(st.b);
      }, 350 + i * gap));
    });
  }

  /* ---------- 改行位置: 日本語の文を文節の境目でだけ折り返す ----------
     body の word-break: keep-all と組み合わせ、文節の間に <wbr> を入れる（BudouX）。
     innerHTML で文を差し込んだら、その要素に phrase() をかける。SVG の中は対象外。 */
  const JA = /[　-ヿ㐀-鿿＀-￯]/;
  // 行頭に来てはいけない文字（助詞・小さいかな・閉じ括弧・句読点）で始まる文節は前の文節につなげる。
  // BudouX は「（あなた）|は」「」|の」のように括弧の後で切ることがあるため。
  const NO_START = /^[をにがはのへてゃゅょぁぃぅぇぉっァィゥェォッャュョー、。・）」』，．：！？]/;
  // 閉じ括弧の直後はブラウザが keep-all でも折るので、文節の中では WORD JOINER（U+2060）でつなぐ。
  const phrases = text => window.BudouX.parse(text).reduce((a, p) => {
    // 「3-0」「4-4-2」は数字とハイフンの間で折らない（文節をつなぎ、ハイフンの後を WORD JOINER でつなぐ）
    if (a.length && (NO_START.test(p) || (/\d-$/.test(a[a.length - 1]) && /^\d/.test(p)))) a[a.length - 1] += p; else a.push(p);
    return a;
  }, []).map(p => p.replace(/([）」』)])(?=.)/g, '$1⁠').replace(/(\d-)(?=\d)/g, '$1⁠'));
  function phrase(root) {
    if (!root || !window.BudouX) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (JA.test(n.nodeValue) && !n.parentElement.closest('svg, script, style')
        && !/^(nowrap|pre)/.test(getComputedStyle(n.parentElement).whiteSpace)) // 1行のラベルには入れない（Chrome は nowrap でも <wbr> で折る）
        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
    });
    const list = [];
    while (w.nextNode()) list.push(w.currentNode);
    list.forEach(n => {
      const parts = phrases(n.nodeValue);
      if (parts.length < 2) return;
      const frag = document.createDocumentFragment();
      parts.forEach((p, i) => {
        if (i) frag.appendChild(document.createElement('wbr'));
        frag.appendChild(document.createTextNode(p));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

  /* ---------- 画面: ホーム ---------- */
  const TWO_COL = '(min-width: 720px) and (min-aspect-ratio: 5/4)';
  function pips(n) { return [0, 1, 2].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join(''); }
  const CLUB_ICON = `<span class="ico">${icon('board')}</span>`;

  // レベルと「名将の戦術」のカード: 名前・題・自己ベスト、2行目に対象・特徴・問題数
  function card(D, mark, label, best) {
    const b = best[D.id];
    return `<button class="lv" data-start="${esc(D.id)}" aria-label="${esc(label)} ${esc(D.title)}">
      <span class="lv-head">${mark}<span class="lv-name">${esc(label)}</span><span class="lv-title">${esc(D.title)}</span><span class="lv-best"><small>最高</small><b>${b == null ? '—' : esc(b)}</b>/${maxOf(D)}</span></span>
      <span class="lv-who"><span class="lv-w">${esc(D.who)}${LV.includes(D) ? '向け' : ''}${D.feat ? `、${esc(D.feat)}` : ''}</span><span class="lv-n">${D.q.length}問</span></span>
    </button>`;
  }

  // 前節の一戦: いまの日時（日本時間）から、終わっている直近の節を選ぶ（logic.js の lastRound）
  const liveInfo = () => {
    const L = (window.LIVE || [])[0];
    return L ? { L, ...TM.lastRound(L, Date.now()) } : null;
  };
  function liveCard() {
    const li = liveInfo(); if (!li) return '';
    const { L, done, ready, next, latest } = li;
    const head = ready ? `${L.name} 第${ready.md.no}節` : L.name;
    const sub = ready
      ? (latest ? `${TM.dateLabel(ready.md.dates)}の試合から` : `第${done.md.no}節は分析の準備中。第${ready.md.no}節（${TM.dateLabel(ready.md.dates)}）から`)
      : done ? `第${done.md.no}節は分析の準備中です`
        : next ? `第${next.md.no}節（${TM.dateLabel(next.md.dates)}）が終わると始まります` : '分析を準備中です';
    return `<button class="lv lv-live" data-start="live"${ready ? '' : ' disabled'} aria-label="前節の一戦 ${esc(head)}">
      <span class="lv-head"><span class="ico live" aria-hidden="true"><i></i></span><span class="lv-name">前節の一戦</span><span class="lv-title">${esc(head)}</span>${ready ? `<span class="lv-best"><b>${Math.min(ready.round.q.length, TM.SESSION)}</b>問</span>` : ''}</span>
      <span class="lv-who"><span class="lv-w">${esc(sub)}、非公式の分析</span></span>
    </button>`;
  }
  // 前節の一戦を遊ぶときのデッキ（自己ベストは残さない）
  function liveDeck() {
    const li = liveInfo(); if (!li || !li.ready) return null;
    const { L, ready } = li;
    return { id: 'live', live: true, short: `${L.name} 第${ready.md.no}節`, name: '前節の一戦', title: `${L.name} 第${ready.md.no}節`, summary: ready.round.summary, q: ready.round.q };
  }

  // お気に入りクラブ: 選んだクラブを覚える（localStorage）。ほかのページからも書き換えられるので、知っている id だけを使う
  const FAV_KEY = 'senjutsu-master-fav-v1';
  const loadFav = () => { let v = null; try { v = localStorage.getItem(FAV_KEY); } catch (e) { /* 読めなければ未設定 */ } return FAVD.find(D => D.id === v) || null; };
  const saveFav = id => { try { localStorage.setItem(FAV_KEY, id); } catch (e) { /* 保存できなくても遊べる */ } };
  const clubMag = (c, cls = 'cmag') => `<svg class="${cls}" viewBox="-3 -3 6 6" aria-hidden="true" style="--c:${esc(c.color.home)};--r:${esc(c.color.rim)}"><circle class="cm-r" r="2.45"/><circle class="cm" r="2"/></svg>`;
  // クラブ名を「地名」と「モチーフ」の2行に分けて見せる（幅の狭いタイルでも、折り返して収める）
  const clubName = c => { const m = c.name.match(/^(\p{Script=Han}+)(.+)$/u); return m ? `<span class="pk-place">${esc(m[1])}</span><span class="pk-name">${esc(m[2])}</span>` : `<span class="pk-name">${esc(c.name)}</span>`; };
  // ホームのカード: 未設定なら「クラブを選ぶ」、設定後はそのクラブ（押すと遊ぶ）と、別のボタンの「変える」
  function favCard(best) {
    if (!FAVD.length) return '';
    const D = loadFav();
    if (!D) return `<button class="lv" data-pick="1" aria-label="お気に入りクラブを選ぶ">
      <span class="lv-head"><span class="ico" aria-hidden="true"><i class="club-dot none"></i></span><span class="lv-name">お気に入り</span><span class="lv-title">クラブを選ぶ</span><span class="lv-best"><b>${FAVD.length}</b>クラブ</span></span>
      <span class="lv-who"><span class="lv-w">名場面と戦い方、クラブ名は架空</span></span>
    </button>`;
    const b = best[D.id], c = D.club;
    return `<div class="lv-fav"><button class="lv" data-start="${esc(D.id)}" aria-label="お気に入りクラブ ${esc(D.title)}">
      <span class="lv-head"><span class="ico" aria-hidden="true"><i class="club-dot" style="--c:${esc(c.color.home)};--r:${esc(c.color.rim)}"></i></span><span class="lv-name">お気に入り</span><span class="lv-title">${esc(D.title)}</span><span class="lv-best"><small>最高</small><b>${b == null ? '—' : esc(b)}</b>/${maxOf(D)}</span></span>
      <span class="lv-who"><span class="lv-w">名場面と戦い方、クラブ名は架空</span></span>
    </button><button class="link lv-chg" data-pick="1" aria-label="お気に入りクラブを変える">変える</button></div>`;
  }
  // クラブを選ぶ画面: 北から順に3×3。選ぶと覚えて、すぐに遊び始める
  function favPick() {
    S.screen = 'pick'; clearTimers();
    const cur = loadFav(), best = loadBest();
    app.innerHTML = `
    <div class="screen pick">
      <nav class="bar"><button class="link back" id="back" aria-label="ホームへ戻る">${icon('back')}</button><span class="bar-lv">お気に入りクラブ</span></nav>
      <div class="pk-body">
        <header class="pk-top">
          <h2>応援しているクラブは？</h2>
          <p class="pk-lead">選んだクラブは、ホームから続けて遊べます。名場面と、そのクラブらしい戦い方の${TM.SESSION}問。</p>
        </header>
        <ul class="pk-grid" aria-label="クラブ">
          ${FAVD.map(D => `<li><button class="pk-club${D === cur ? ' on' : ''}" data-fav="${esc(D.id)}"${D === cur ? ' aria-current="true"' : ''} aria-label="${esc(D.title)}、最高 ${best[D.id] == null ? 'なし' : esc(best[D.id]) + '点'}">${clubMag(D.club)}${clubName(D.club)}<span class="pk-best"><b>${best[D.id] == null ? '—' : esc(best[D.id])}</b>/${maxOf(D)}</span></button></li>`).join('')}
        </ul>
        <div class="pk-foot">
          <ul class="key pk-key" aria-label="ボードの見方">
            <li>${clubMag((cur || FAVD[0]).club, 'cmag sm')}クラブの色が味方</li>
            <li><svg viewBox="-3 -3 6 6" aria-hidden="true"><circle r="2.4" class="k-gray"/></svg>灰色が相手</li>
          </ul>
          <p class="pk-note">クラブ名・選手は架空です。場面と背番号は、実際の試合の記録をもとにしています。</p>
        </div>
      </div>
    </div>`;
    phrase(app);
    const on = app.querySelector('.pk-club.on') || app.querySelector('.pk-club'); if (on) on.focus({ preventScroll: true });
  }

  function home() {
    S.screen = 'home'; clearTimers();
    const best = loadBest();
    app.innerHTML = `
    <div class="screen home">
      <div class="h-side">
        <header class="h-top">
          <h1>戦術マスター</h1>
          <p class="lead">ボードの状況を読んで次のプレーを選ぶ。選手が動いて、その理由を見せてくれます。</p>
        </header>
        <ul class="key" aria-label="ボードの見方">
          <li><svg viewBox="-3 -3 6 6" aria-hidden="true"><circle r="2.4" class="k-home"/></svg>味方</li>
          <li><svg viewBox="-3 -3 6 6" aria-hidden="true"><circle r="2.4" class="k-away"/></svg>相手</li>
          <li><svg viewBox="-3 -3 6 6" aria-hidden="true"><circle r="2.5" class="k-me"/><circle r="1.6" class="k-home"/></svg>あなた</li>
          <li><svg class="wide" viewBox="0 -2 16 4" aria-hidden="true"><path class="k-ln" d="M1 0H13"/><path class="k-hd" d="M15 0L12.6-1.3V1.3Z"/></svg>パス</li>
          <li><svg class="wide" viewBox="0 -2 16 4" aria-hidden="true"><path class="k-ln k-dash" d="M1 0H13"/><path class="k-hd" d="M15 0L12.6-1.3V1.3Z"/></svg>走る</li>
          <li><svg class="wide" viewBox="0 -2 16 4" aria-hidden="true"><path class="k-ln" d="M1 0Q2 -1.2 3 0T5 0T7 0T9 0T11 0T13 0"/><path class="k-hd" d="M15 0L12.6-1.3V1.3Z"/></svg>ドリブル</li>
        </ul>
        <div class="foot-row">
          <p class="foot"><span>味方はいつも上（↑）へ攻めます。</span><span>採点：<span class="nw">ベスト2点</span>・<span class="nw">悪くない1点</span>・<span class="nw">要注意0点</span></span></p>
          <button class="link move-link" id="moveOpen" aria-haspopup="dialog" aria-label="記録の引っこし・バックアップ">${icon('move')}記録の引っこし</button>
        </div>
      </div>
      <nav class="levels" aria-label="遊ぶものを選ぶ">
        <div class="grp">${LV.map(L => card(L, `<span class="pips" aria-hidden="true">${pips(L.no)}</span>`, L.name, best)).join('')}</div>
        <div class="grp">${card(CLUB, CLUB_ICON, CLUB.name, best)}${liveCard()}${favCard(best)}</div>
      </nav>
    </div>`;
    phrase(app);
  }

  /* ---------- 画面: 問題 ---------- */
  function dots() {
    return S.qs.map((_, i) => {
      const a = S.ans[i];
      return `<li class="${a ? 'r' + a.sc : (i === S.qi ? 'now' : '')}"></li>`;
    }).join('');
  }

  function question() {
    S.screen = 'play'; S.done = false; S.tab = 'why'; clearTimers();
    const D = S.deck, s = cur(), v = s.view;
    seen(D, s.id);
    app.innerHTML = `
    <div class="screen play${D.fav ? ' club' : ''}" data-qid="${esc(s.id)}"${D.fav ? ` style="--home:${esc(D.club.color.home)};--away:${esc(D.club.color.away)};--rim:${esc(D.club.color.rim)}"` : ''}>
      <nav class="bar">
        <button class="link back" id="back" aria-label="ホームへ戻る">${icon('back')}</button>
        <span class="bar-lv">${esc(D.short)}</span>
        <ol class="dots" aria-hidden="true">${dots()}</ol>
        <span class="bar-q">${S.qi + 1}<small>/${S.qs.length}</small></span>
        <span class="bar-pt"><b id="pt">${total()}</b>点</span>
      </nav>
      <div class="stage">
        <div class="board-area">
          <div class="board" id="board" style="--ar:${f(v[2] / v[3])}">${pitchSVG(s)}
            <span class="dir">攻撃 ↑</span>
            <span class="stamp" id="stamp" hidden></span>
            ${s.hint ? `<p class="hint-cap" id="hint" hidden>ヒント：${esc(s.hint)}</p>` : ''}
          </div>
        </div>
        <section class="panel" id="panel">
          <div class="qhead">
            <span class="phase ph-${s.ph}"><i></i>${PH[s.ph]}</span>
            ${s.lv ? `<span class="diff" role="img" aria-label="難しさ ${LVN[s.lv]}"><span class="pips" aria-hidden="true">${pips(s.lv)}</span></span>` : ''}
            <h2 class="qt">${esc(s.t)}</h2>
            ${s.hint ? `<button class="hint-btn" id="hintBtn" aria-pressed="false">${icon('hint')}ヒント</button>` : ''}
          </div>
          ${s.ctx || s.tag ? `<p class="ctx">${s.tag ? `<span class="ctx-tag">${esc(s.tag)}</span>` : ''}${s.ctx ? `<span>${esc(s.ctx)}</span>` : ''}</p>` : ''}
          <p class="sit">${esc(s.s)}</p>
          <p class="qq">${esc(s.q)}</p>
          <div class="opts" role="group" aria-label="選択肢">
            ${s.opts.map(o => `<button class="opt" data-k="${esc(o.k)}"><span class="k">${esc(o.k)}</span><span class="l">${esc(o.l)}</span></button>`).join('')}
          </div>
        </section>
      </div>
    </div>`;
    phrase(app);
    lockPanel();
  }

  // 縦並びのとき、回答後に出る解説（どの選択肢・どのタブでも）が収まる高さを先に測ってパネルを固定する。
  // 問題と解説でパネルの高さが同じなので、ボードの大きさは変わらない。ボードには最低でも残り高さの 38% を残す。
  function lockPanel() {
    const panel = document.getElementById('panel');
    if (!panel || matchMedia(TWO_COL).matches) return;
    const s = cur(), room = document.querySelector('.stage').clientHeight;
    const probe = document.createElement('section');
    probe.className = 'panel is-fb';
    probe.setAttribute('aria-hidden', 'true');
    probe.style.cssText = `position:absolute;left:-9999px;top:0;visibility:hidden;max-height:none;height:auto;width:${panel.clientWidth}px`;
    panel.parentNode.appendChild(probe);
    let need = 0;
    s.opts.forEach(o => {
      tabList(s, o, bestOf(s)).forEach(([id]) => {
        probe.innerHTML = fbHTML(s, o, id, false);
        phrase(probe);
        need = Math.max(need, probe.scrollHeight);
      });
    });
    probe.remove();
    panel.style.height = Math.round(Math.min(Math.max(panel.offsetHeight, need), room * 0.62)) + 'px';
  }

  const bestOf = s => s.opts.reduce((p, q) => (q.sc > p.sc ? q : p));

  function fbHTML(s, o, tab, last) {
    return `
      <div class="tabs" role="tablist">${tabList(s, o, bestOf(s)).map(([id, n]) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${id === tab}">${n}</button>`).join('')}</div>
      <div class="tabbody" id="tabbody" role="tabpanel">${tabBody(tab, o.k)}</div>
      <div class="acts">
        <button class="btn ghost" id="replay" aria-label="動きをもう一度再生">${icon('replay')}動き</button>
        <button class="btn" id="next">${last ? '結果を見る' : '次の問題へ'}${icon('next')}</button>
      </div>`;
  }

  function tabList(s, o, best) {
    const T = [['why', '理由'], ['ex', '解説'], ['key', '用語']];
    if (s.coach) T.push(['coach', '指導'], ['drill', '練習']);
    if (s.opts.some(x => x.k !== o.k && x.k !== best.k)) T.push(['rest', 'ほかの選択肢']);
    return T;
  }

  function tabBody(id, k = S.ans[S.qi].k) {
    const s = cur();
    const o = s.opts.find(x => x.k === k);
    const best = bestOf(s);
    const line = (x, tag) => `<p class="oline c${x.sc}"><span class="kc">${esc(x.k)}</span><span>${tag}${esc(x.l)}</span></p><p>${esc(x.why)}</p>`;
    switch (id) {
      case 'why':
        return line(o, 'あなたの選択：') + (o.k !== best.k ? line(best, 'ベスト：') : '');
      case 'ex': return `<p>${esc(s.ex)}</p>`;
      case 'key': return `<p class="term"><b class="hl">${esc(s.key[0])}</b></p><p>${esc(s.key[1])}</p>`;
      case 'coach': return `<p>${esc(s.coach)}</p>`;
      case 'drill': return `<p>${esc(s.drill)}</p>`;
      case 'rest': return s.opts.filter(x => x.k !== o.k && x.k !== best.k).map(x => line(x, `${RES[x.sc]}：`)).join('');
    }
    return '';
  }

  function setTab(id) {
    S.tab = id;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === id)));
    const b = document.getElementById('tabbody');
    b.innerHTML = tabBody(id); b.scrollTop = 0;
    phrase(b);
  }

  function choose(k) {
    if (S.done) return;
    const s = cur();
    const o = s.opts.find(x => x.k === k); if (!o) return;
    S.done = true;
    S.ans[S.qi] = { k, sc: o.sc };
    const best = s.opts.reduce((a, b) => (b.sc > a.sc ? b : a));

    document.querySelectorAll('#pitch .og').forEach(g => {
      const kk = g.dataset.k, x = s.opts.find(y => y.k === kk);
      g.classList.add(kk === best.k ? 'r2' : kk === k ? 'r' + x.sc : 'dim');
    });
    document.getElementById('pitch').classList.add('answered');
    const stamp = document.getElementById('stamp');
    stamp.className = 'stamp v' + o.sc; stamp.innerHTML = `<i></i>${esc(k)} · ${VERDICT[o.sc]}<b>+${o.sc}点</b>`; stamp.hidden = false;
    const hint = document.getElementById('hint'); if (hint) hint.hidden = true;
    document.getElementById('pt').textContent = total();
    document.querySelector('.dots').innerHTML = dots();

    const panel = document.getElementById('panel');
    panel.classList.add('is-fb');
    panel.innerHTML = fbHTML(s, o, 'why', S.qi === S.qs.length - 1);
    phrase(panel);
    play(s);
  }

  function next() {
    if (S.qi < S.qs.length - 1) { S.qi++; question(); } else result();
  }

  /* ---------- 画面: 結果 ---------- */
  // 次へ進むボタン: 初級→中級→上級→名将の戦術
  const nextDeck = D => { const i = LV.indexOf(D); return i < 0 ? null : (LV[i + 1] || CLUB); };
  function result() {
    S.screen = 'result'; clearTimers();
    const D = S.deck, sc = total(), mx = S.qs.length * 2, pct = sc / mx;
    let isNew = false;
    if (REC.includes(D)) {
      const best = loadBest(), prev = best[D.id];
      isNew = prev == null || sc > prev;
      if (isNew) { best[D.id] = sc; saveBest(best); }
    }
    const msg = D.live ? D.summary
      : pct >= 0.85
        ? (D === CLUB ? '名将たちの狙いを読み取れています。' : D === LV[LV.length - 1] ? '構造と言葉の両方で説明できるレベルです。' : '戦術眼あり。次のレベルへ進みましょう。')
        : pct >= 0.6 ? '原則はつかめています。「要注意」の問題を見直すとさらに伸びます。'
          : '原則をひとつずつ。解説を読んで、もう一度挑戦してみましょう。';
    const nx = nextDeck(D);
    app.innerHTML = `
    <div class="screen result">
      <div class="r-head">
        <p class="eyebrow">${esc(D.short)} · ${esc(D.live ? D.name : D.title)}</p>
        <div class="score"><b>${sc}</b><span>/${mx}</span>${isNew ? '<em><i></i>自己ベスト</em>' : ''}</div>
        <p class="msg${D.live ? ' msg-live' : ''}">${esc(msg)}</p>
      </div>
      <ol class="rlist">
        ${S.qs.map((q, i) => {
          const a = S.ans[i] || { sc: 0 };
          return `<li><span class="rt"><b>${esc(q.t)}</b><small>${esc(q.key[0])}</small></span><span class="rv c${a.sc}"><i></i>${RES[a.sc]}</span></li>`;
        }).join('')}
      </ol>
      <div class="acts">
        <button class="btn ghost" id="retry">${D.live || D.fav ? 'もう一度' : '別の問題で'}</button>
        ${nx ? `<button class="btn" id="nextLv">${esc(nx === CLUB ? nx.title : nx.short)}へ${icon('next')}</button>` : ''}
        <button class="btn ghost" id="toHome">ホームへ</button>
      </div>
    </div>`;
    phrase(app);
  }

  // 遊び始める: 問題を選び（直近に出たものを避け、場面がばらけるように）、選択肢を並べ替える
  function start(D) {
    if (!D || !D.q.length) return home();
    S.deck = D; S.qi = 0; S.ans = [];
    S.qs = TM.pick(D.q, TM.SESSION, REC.includes(D) ? loadHist()[D.id] : []).map(q => TM.prep(q));
    question();
  }
  const deckOf = id => (id === 'live' ? liveDeck() : REC.find(D => D.id === id));

  /* ---------- 記録の引っこし（自己ベストをファイルかコードで持ち出す・読み込む） ----------
     自己ベストは localStorage なので、URL（オリジン）が変わる・ホーム画面のアプリと Safari・別の端末では引き継がれない。
     コード: `SENJUTSU1:basic=10,coach=6:xxxx`（末尾4文字は確認用。欠け・書き換えを見つける）。ファイルはこのコードを入れた .txt。
     読み込んだ記録は信用しない（cleanBest を通す）。今の記録より高いレベルだけを更新するので、読み込みで記録が下がることはない。 */
  const CODE_V = 'SENJUTSU1';
  const MOVE_FILE = 'senjutsu-master-kiroku.txt';
  const MOVE_MAX = 4096; // これより大きいファイル・文字は戦術マスターのものではない
  const check = s => { // FNV-1a（32bit）を 36 進4文字に
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return (h % 1679616).toString(36).padStart(4, '0');
  };
  const makeCode = best => {
    const body = REC.filter(D => best[D.id] != null).map(D => `${D.id}=${best[D.id]}`).join(',');
    return `${CODE_V}:${body}:${check(`${CODE_V}:${body}`)}`;
  };
  function readCode(text) {
    const raw = String(text || '');
    if (raw.length > MOVE_MAX) return { reason: 'big' };
    const t = raw.normalize('NFKC').replace(/[\s\u200B-\u200D\u2060\uFEFF]+/g, '');
    if (!t) return { reason: 'empty' };
    const m = t.match(/SENJUTSU1:([a-z0-9=,]*):([0-9a-z]{4})/i);
    if (!m) return { reason: /SENJUTSU1/i.test(t) ? 'broken' : 'noprefix' };
    const body = m[1].toLowerCase();
    if (check(`${CODE_V}:${body}`) !== m[2].toLowerCase()) return { reason: 'broken' };
    const o = {};
    for (const part of body.split(',').filter(Boolean)) {
      const kv = part.split('=');
      if (kv.length !== 2 || !/^[a-z]+$/.test(kv[0]) || !/^\d{1,3}$/.test(kv[1])) return { reason: 'broken' };
      o[kv[0]] = Number(kv[1]);
    }
    const best = cleanBest(o);
    return Object.keys(best).length ? { best } : { reason: 'nodata' };
  }
  const MOVE_ERR = {
    empty: 'コードが空です。貼り付けてから「読み込む」を押してください。',
    noprefix: '「SENJUTSU1」で始まるコードが見つかりませんでした。戦術マスターで作ったファイルかコードか、確かめてください。',
    broken: 'コードの一部が欠けているか、変わっています。もう一度コピーし直すか、ファイルで移してください。',
    big: '大きすぎて読めませんでした。戦術マスターで保存したファイルを選んでください。',
    nodata: '読み込める記録が入っていませんでした。'
  };
  // いまの記録: レベル3つと名将の戦術はいつも、お気に入りクラブは記録のあるクラブだけ
  const bestLine = best => REC.filter(D => !D.fav || best[D.id] != null).map(D => `${mvName(D)} ${best[D.id] == null ? '—' : best[D.id]}/${maxOf(D)}`).join('・');

  async function saveFile(text) {
    // アーティファクトではホストの保存確認（downloads）、ホーム画面のアプリ・Safari では共有シート（「ファイル」に保存）、どちらもなければ通常のダウンロード
    const cl = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
    if (cl) {
      const dl = await cl.use('downloads').catch(() => null);
      if (dl) {
        try { await dl.save({ filename: MOVE_FILE, data: text }); return 'saved'; }
        catch (e) { return e && e.code === 'declined' ? 'declined' : 'unavailable'; }
      }
    }
    try {
      const file = new File([text], MOVE_FILE, { type: 'text/plain' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: '戦術マスターの記録' }); return 'shared'; }
    } catch (e) { if (e && e.name === 'AbortError') return 'declined'; }
    try {
      const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      const a = document.createElement('a'); a.href = url; a.download = MOVE_FILE;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return 'saved';
    } catch (e) { return 'unavailable'; }
  }
  async function copyCode(el) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(el.value); return 'copied'; } } catch (e) { /* 次の方法へ */ }
    try { el.focus(); el.select(); el.setSelectionRange(0, el.value.length); if (document.execCommand && document.execCommand('copy')) return 'copied'; } catch (e) { /* 次の方法へ */ }
    return 'selected';
  }

  let moveReturn = null;
  function openMove() {
    const best = loadBest(), has = Object.keys(best).length > 0, code = makeCode(best);
    moveReturn = document.activeElement;
    app.insertAdjacentHTML('beforeend', `
    <div class="sheet-bg" id="mv">
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="mvT">
        <div class="sheet-head"><h2 id="mvT">記録の引っこし</h2><button class="link sheet-x" id="mvClose" aria-label="閉じる">${icon('close')}</button></div>
        <p class="sheet-sub">自己ベストは、いま開いているアプリの中だけに保存されています（ホーム画面のアプリと Safari も別）。別の端末や新しい URL へは、ファイルかコードで移せます。</p>
        <p class="mv-now" id="mvNow">いまの記録　${esc(bestLine(best))}</p>
        <h3 class="sheet-h">持っていく</h3>
        <div class="mv-row"><button class="btn" id="mvSave"${has ? '' : ' disabled'}>ファイルに保存</button><button class="btn ghost" id="mvCopy"${has ? '' : ' disabled'}>コードをコピー</button></div>
        <textarea class="mv-code mv-out" id="mvOut" rows="2" readonly placeholder="まだ記録がありません" aria-label="記録のコード" autocomplete="off" spellcheck="false">${has ? esc(code) : ''}</textarea>
        <h3 class="sheet-h">受け取る</h3>
        <div class="mv-row"><label class="btn ghost mv-file">ファイルを選ぶ<input type="file" id="mvFile" accept=".txt,text/plain"></label></div>
        <div class="mv-row"><input class="mv-code" id="mvIn" maxlength="${MOVE_MAX}" placeholder="コードを貼り付け" aria-label="受け取るコード" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"><button class="btn ghost" id="mvTake">読み込む</button></div>
        <p class="mv-msg" id="mvMsg" role="status" aria-live="polite">読み込んだ記録は、いまより高いレベルだけを更新します。</p>
      </section>
    </div>`);
    const sh = document.getElementById('mv');
    phrase(sh);
    const msg = t => { const m = sh.querySelector('#mvMsg'); m.textContent = t; phrase(m); };
    sh.querySelector('#mvClose').addEventListener('click', closeMove);
    sh.addEventListener('click', e => { if (e.target === sh) closeMove(); });
    sh.querySelector('#mvSave').addEventListener('click', async () => {
      const text = `戦術マスターの記録（自己ベスト）\n戦術マスターのホームの「記録の引っこし」→「ファイルを選ぶ」でこのファイルを選ぶと、記録を移せます。\n${makeCode(loadBest())}\n`;
      const r = await saveFile(text);
      msg(r === 'shared' ? `共有メニューで「"ファイル"に保存」を選ぶと、${MOVE_FILE} として残ります。`
        : r === 'saved' ? `${MOVE_FILE} を保存しました。移す先で「ファイルを選ぶ」から選んでください。`
          : r === 'declined' ? '保存をやめました。'
            : 'ここではファイルを保存できませんでした。「コードをコピー」を使ってください。');
    });
    sh.querySelector('#mvCopy').addEventListener('click', async () => {
      const r = await copyCode(sh.querySelector('#mvOut'));
      msg(r === 'copied' ? 'コードをコピーしました。移す先で貼り付けて「読み込む」を押してください。'
        : 'コードを選びました。出てきたメニューの「コピー」を押してください。');
    });
    const take = text => {
      const r = readCode(text);
      if (!r.best) return msg(MOVE_ERR[r.reason]);
      const now = loadBest(), up = [];
      REC.forEach(D => {
        const v = r.best[D.id];
        if (v != null && (now[D.id] == null || v > now[D.id])) { up.push(`${mvName(D)} ${now[D.id] == null ? '—' : now[D.id]}→${v}`); now[D.id] = v; }
      });
      if (!up.length) return msg('読み込んだ記録は、いまの記録と同じか低いので、変わりませんでした。');
      saveBest(now);
      const nb = sh.querySelector('#mvNow'); nb.textContent = `いまの記録　${bestLine(now)}`; phrase(nb);
      msg(`記録を移しました（${up.join('、')}）。`);
    };
    sh.querySelector('#mvTake').addEventListener('click', () => take(sh.querySelector('#mvIn').value));
    sh.querySelector('#mvFile').addEventListener('change', async e => {
      const file = e.target.files && e.target.files[0]; e.target.value = '';
      if (!file) return;
      if (file.size > MOVE_MAX) return msg(MOVE_ERR.big);
      try { take(await file.text()); } catch (err) { msg(MOVE_ERR.noprefix); }
    });
    sh.querySelector(has ? '#mvSave' : '#mvFile').focus();
  }
  function closeMove() {
    const sh = document.getElementById('mv'); if (!sh) return;
    sh.remove();
    if (S.screen === 'home') { home(); const b = document.getElementById('moveOpen'); if (b) b.focus(); }
    else if (moveReturn && moveReturn.isConnected) moveReturn.focus();
  }

  /* ---------- イベント ---------- */
  app.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('#moveOpen')) return openMove();
    if (t.closest('#mv')) return; // 引っこしの画面の中のボタンは、それぞれのリスナーで扱う
    if (t.closest('[data-pick]')) return favPick();
    const fv = t.closest('[data-fav]'); if (fv) { saveFav(fv.dataset.fav); return start(deckOf(fv.dataset.fav)); }
    const st = t.closest('[data-start]'); if (st) return start(deckOf(st.dataset.start));
    const op = t.closest('.opt'); if (op) return choose(op.dataset.k);
    const og = t.closest('#pitch .og'); if (og && !S.done) return choose(og.dataset.k);
    const tb = t.closest('.tab'); if (tb) return setTab(tb.dataset.tab);
    const btn = t.closest('button'); const id = btn ? btn.id : '';
    if (id === 'back' || id === 'toHome') return home();
    if (id === 'next') return next();
    if (id === 'replay') return play(cur());
    if (id === 'retry') return start(S.deck.live ? liveDeck() || S.deck : S.deck);
    if (id === 'nextLv') return start(nextDeck(S.deck));
    if (id === 'hintBtn') {
      const h = document.getElementById('hint'); h.hidden = !h.hidden;
      btn.setAttribute('aria-pressed', String(!h.hidden));
    }
  });
  document.addEventListener('keydown', e => {
    const sh = document.getElementById('mv');
    if (sh) { // 引っこしの画面: Esc で閉じる、Tab は画面の中だけを回る
      if (e.key === 'Escape') { e.preventDefault(); closeMove(); return; }
      if (e.key === 'Tab') {
        const els = [...sh.querySelectorAll('button:not([disabled]), input')];
        const i = els.indexOf(document.activeElement);
        if (e.shiftKey ? i <= 0 : i === els.length - 1) { e.preventDefault(); els[e.shiftKey ? els.length - 1 : 0].focus(); }
      }
      return;
    }
    if (S.screen !== 'play' || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    if (!S.done && ['A', 'B', 'C'].includes(k)) choose(k);
    else if (S.done && (e.key === 'ArrowRight')) next();
  });
  addEventListener('resize', () => {
    const p = document.getElementById('panel');
    if (p && matchMedia(TWO_COL).matches) p.style.height = '';
  });

  home();
})();
</script>
